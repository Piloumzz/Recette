<!DOCTYPE html>
<html lang="fr">
<head>

<script>
  /* Amélioration progressive : les états initiaux d'animation n'existent que si ce script s'exécute */
  (function () {
    var d = document.documentElement;
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    d.classList.add("has-motion");
    /* Filet de sécurité : si les libs ne démarrent pas sous 4 s, le contenu redevient visible */
    setTimeout(function () { if (!d.classList.contains("motion-ready")) d.classList.remove("has-motion"); }, 4000);
  })();
</script>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<!-- Versions fixes, téléchargées en parallèle, exécutées dans l'ordre sans bloquer le parsing -->
<script defer src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js" onerror="document.documentElement.classList.remove('has-motion')"></script>
<script defer src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js" onerror="document.documentElement.classList.remove('has-motion')"></script>

        }

</script>
<style>
  :root {
    --bg: #EEE7D8; --surface: #F8F3E7; --surface-2: #E6DEC9; --ink: #26323A; --muted: #55606A; --line: #D3CAB3;
    --accent: #4F5D26; --accent-ink: #F8F3E7; --accent-text: #4F5D26;
    --sage: #D8DDBF; --sage-ink: #34411A;
    --warn-bg: #F1DFB4; --warn-ink: #5E3F0C; --err-bg: #EFD3CE; --err-ink: #74271F;
    --focus: #2A5E92; --overlay: rgba(24, 31, 36, .55);
    --eco: #7B8F3C; --equi: #4F5D26; --conf: #2E3A42;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161D22; --surface: #1F282E; --surface-2: #2A353D; --ink: #EDE6D6; --muted: #A8B0B2; --line: #36434C;
      --accent: #B4C373; --accent-ink: #171E12; --accent-text: #C2D083;
      --sage: #2F3A24; --sage-ink: #D5E0A8;
      --warn-bg: #3D3115; --warn-ink: #F0D58C; --err-bg: #43211E; --err-ink: #F3B8B0;
      --focus: #8DB8E8; --overlay: rgba(0, 0, 0, .65);
      --eco: #A3B563; --equi: #B4C373; --conf: #8FA3B0;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161D22; --surface: #1F282E; --surface-2: #2A353D; --ink: #EDE6D6; --muted: #A8B0B2; --line: #36434C;
    --accent: #B4C373; --accent-ink: #171E12; --accent-text: #C2D083;
    --sage: #2F3A24; --sage-ink: #D5E0A8;
    --warn-bg: #3D3115; --warn-ink: #F0D58C; --err-bg: #43211E; --err-ink: #F3B8B0;
    --focus: #8DB8E8; --overlay: rgba(0, 0, 0, .65);
    --eco: #A3B563; --equi: #B4C373; --conf: #8FA3B0;
  }
  html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + var(--topbar-h, 0px)); }
  html, body { background: var(--bg); }
  body { color: var(--ink); font-family: Figtree, ui-sans-serif, system-ui, sans-serif; font-size: 16px; line-height: 1.5; min-height: 100vh; margin: 0; }
  h1, h2, h3, .display { font-family: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif; letter-spacing: -0.02em; line-height: 1.1; }
  .muted { color: var(--muted); }
  .skip { position: absolute; left: -999px; top: 0; background: var(--accent); color: var(--accent-ink); padding: .5rem 1rem; border-radius: 8px; z-index: 100; }
  .skip:focus { left: 1rem; top: 1rem; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  button, input, label { -webkit-tap-highlight-color: transparent; }
  button { cursor: pointer; font: inherit; color: inherit; }

  /* ----- boutons ----- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; min-height: 44px; padding: .55rem 1.1rem; border-radius: 12px; font-weight: 600; border: 1.5px solid transparent; transition: background-color .15s, border-color .15s, translate .2s var(--ease), scale .1s; }
  .btn:active { scale: .98; }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-primary:disabled { opacity: .45; cursor: not-allowed; filter: none; }
  .btn-soft { background: var(--sage); color: var(--sage-ink); }
  .btn-soft:hover { filter: brightness(.96); }
  .btn-line { background: transparent; border-color: var(--line); }
  .btn-line:hover { border-color: var(--accent-text); }
  .btn-sm { min-height: 38px; padding: .35rem .8rem; font-size: .9rem; border-radius: 10px; }

  /* ----- mise en page ----- */
  .shell { width: 100%; max-width: 1120px; margin: 0 auto; padding: 0 1.1rem; }
  .topbar { border-bottom: 1px solid var(--line); }
  .brand { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 1.35rem; letter-spacing: -0.03em; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; }
  .fade-in { animation: fadeIn .2s ease-out; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* ----- progression ----- */
  .bar { height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
  .bar > span { display: block; height: 100%; width: 100%; background: var(--accent); border-radius: 99px; transform-origin: left center; }
  .steps { display: none; }
  @media (min-width: 768px) { .steps { display: flex; } }
  .step-btn { display: flex; align-items: center; gap: .5rem; padding: .3rem .1rem; background: none; border: 0; color: var(--muted); font-size: .9rem; font-weight: 500; text-align: left; }
  .step-btn .n { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: .8rem; font-weight: 700; background: var(--surface-2); color: var(--muted); flex: none; }
  .step-btn.is-done .n { background: var(--sage); color: var(--sage-ink); }
  .step-btn.is-current { color: var(--ink); font-weight: 700; }
  .step-btn.is-current .n { background: var(--accent); color: var(--accent-ink); }

  /* ----- options (cases, radios) ----- */
  .vh { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); border: 0; white-space: nowrap; }
  .opt-card { position: relative; display: block; cursor: pointer; }
  .opt-card .body { display: flex; align-items: flex-start; gap: .75rem; padding: .9rem 1rem; border: 1.5px solid var(--line); border-radius: 14px; background: var(--surface); transition: border-color .15s, background-color .15s; height: 100%; }
  .opt-card:hover .body { border-color: var(--accent-text); }
  .opt-card input:checked + .body { border-color: var(--accent); background: var(--sage); }
  .opt-card input:focus-visible + .body { outline: 3px solid var(--focus); outline-offset: 2px; }
  .tick { flex: none; width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--muted); display: grid; place-items: center; margin-top: 2px; color: transparent; transition: background-color .15s, border-color .15s; }
  .opt-card input:checked + .body .tick { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .opt-card input[type="radio"] + .body .tick { border-radius: 50%; }
  .opt-title { font-weight: 600; display: block; }
  .opt-desc { font-size: .88rem; color: var(--muted); display: block; margin-top: 2px; }
  .opt-card input:checked + .body .opt-desc { color: var(--sage-ink); }
  .ico { font-size: 1.4rem; line-height: 1; flex: none; margin-top: 1px; }

  .dayrow { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .6rem; padding: .6rem .8rem; border: 1.5px solid var(--line); border-radius: 14px; background: var(--surface); transition: border-color .15s, background-color .15s; }
  .dayrow.is-on { border-color: var(--accent); background: var(--sage); }
  .dayrow label.chk { display: flex; align-items: center; gap: .7rem; cursor: pointer; min-height: 40px; flex: 1 1 150px; font-weight: 600; }
  .dayrow input:checked + .tick { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .dayrow input:focus-visible + .tick { outline: 3px solid var(--focus); outline-offset: 2px; }
  .seg { display: none; border-radius: 12px; background: var(--surface); border: 1.5px solid var(--line); padding: 3px; gap: 2px; }
  .dayrow.is-on .seg { display: inline-flex; }
  .seg label { cursor: pointer; }
  .seg span { display: block; padding: .35rem .75rem; border-radius: 9px; font-size: .88rem; font-weight: 600; color: var(--muted); min-height: 34px; line-height: 1.6; }
  .seg input:checked + span { background: var(--accent); color: var(--accent-ink); }
  .seg input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 1px; }

  /* ----- nombre de personnes ----- */
  .round { width: 56px; height: 56px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); font-size: 1.7rem; line-height: 1; display: grid; place-items: center; transition: border-color .15s, background-color .15s; }
  .round:hover:not(:disabled) { border-color: var(--accent-text); background: var(--sage); }
  .round:disabled { opacity: .35; cursor: not-allowed; }
  .num-input { width: 6rem; text-align: center; font-family: "Bricolage Grotesque", sans-serif; font-size: 3.4rem; font-weight: 800; background: transparent; border: 0; border-bottom: 3px solid var(--accent); color: var(--ink); padding: 0; -moz-appearance: textfield; }
  .num-input::-webkit-outer-spin-button, .num-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  /* ----- budget ----- */
  input[type="range"] { width: 100%; accent-color: var(--accent); height: 32px; cursor: pointer; }
  .field { background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: .5rem .7rem; color: var(--ink); font-weight: 600; min-height: 44px; }
  .gauge { position: relative; display: flex; height: 12px; border-radius: 99px; overflow: hidden; gap: 2px; }
  .gauge i { display: block; height: 100%; }
  .gauge .g1 { width: 30%; background: var(--eco); } .gauge .g2 { width: 30%; background: var(--equi); opacity: .75; } .gauge .g3 { width: 40%; background: var(--conf); }
  .marker { position: absolute; top: -6px; left: 0; width: 100%; height: 24px; translate: var(--p, 0%); transition: translate .2s ease; pointer-events: none; }
  .marker::after { content: ""; position: absolute; top: 0; left: -2px; width: 4px; height: 100%; background: var(--ink); border-radius: 2px; }
  .badge { display: inline-flex; align-items: center; padding: .15rem .6rem; border-radius: 99px; font-size: .82rem; font-weight: 600; background: var(--surface-2); color: var(--ink); white-space: nowrap; }
  .badge.accent { background: var(--sage); color: var(--sage-ink); }
  .level { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 1.6rem; letter-spacing: -0.02em; }

  /* ----- alertes ----- */
  .alert { border-radius: 14px; padding: .8rem 1rem; font-size: .95rem; }
  .alert.warn { background: var(--warn-bg); color: var(--warn-ink); }
  .alert.err { background: var(--err-bg); color: var(--err-ink); }
  .alert.info { background: var(--sage); color: var(--sage-ink); }
  .alert strong { font-weight: 700; }

  /* ----- navigation du formulaire ----- */
  .nav { position: sticky; bottom: 0; background: linear-gradient(to top, var(--bg) 70%, transparent); padding: 1rem 0 .75rem; }

  /* ----- planning ----- */
  .day-card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 1.1rem 1.1rem 1rem; display: flex; flex-direction: column; gap: .9rem; }
  .day-name { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 1.7rem; letter-spacing: -0.03em; padding-left: .7rem; border-left: 5px solid var(--accent); }
  .slot { border-radius: 14px; border: 1px solid var(--line); background: var(--bg); overflow: hidden; }
  .slot-open { display: flex; gap: .8rem; width: 100%; text-align: left; padding: .8rem; background: none; border: 0; transition: background-color .15s; }
  .slot-open:hover { background: var(--sage); }
  .slot-icon { flex: none; width: 52px; height: 52px; border-radius: 14px; background: var(--sage); display: grid; place-items: center; font-size: 1.7rem; }
  .slot-name { font-weight: 700; font-size: 1.02rem; line-height: 1.25; }
  .meta { display: flex; flex-wrap: wrap; gap: .25rem .75rem; font-size: .85rem; color: var(--muted); margin-top: .35rem; }
  .meta b { color: var(--ink); font-weight: 600; }
  .slot-foot { display: flex; align-items: center; justify-content: space-between; gap: .5rem; padding: .45rem .8rem; border-top: 1px dashed var(--line); }
  .link-btn { background: none; border: 0; color: var(--accent-text); font-weight: 600; font-size: .9rem; padding: .35rem .2rem; min-height: 36px; border-radius: 8px; }
  .link-btn:hover { text-decoration: underline; }
  .slot-empty { padding: 1rem; font-size: .92rem; color: var(--muted); }

  /* ----- modales ----- */
  .overlay { position: fixed; inset: 0; z-index: 50; background: var(--overlay); display: flex; align-items: flex-end; justify-content: center; padding-top: env(safe-area-inset-top, 0px); animation: fadeIn .18s ease-out; }
  @media (min-width: 700px) { .overlay { align-items: center; padding: 1.5rem; } }
  .dialog { background: var(--surface); color: var(--ink); width: 100%; max-width: 680px; max-height: 92vh; overflow-y: auto; overscroll-behavior: contain; border-radius: 22px 22px 0 0; padding: 1.3rem 1.2rem calc(1.3rem + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -10px 40px rgba(0,0,0,.25); animation: sheetUp .22s ease-out; }
  @media (min-width: 700px) { .dialog { border-radius: 22px; padding: 1.8rem; max-height: 88vh; } }
  @keyframes sheetUp { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
  .x-btn { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); display: grid; place-items: center; }
  .x-btn:hover { background: var(--sage); }
  .facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .6rem; }
  @media (min-width: 560px) { .facts { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .fact { background: var(--bg); border-radius: 12px; padding: .6rem .8rem; }
  .fact b { display: block; font-family: "Bricolage Grotesque", sans-serif; font-size: 1.2rem; font-weight: 700; letter-spacing: -0.02em; }
  .fact span { font-size: .8rem; color: var(--muted); }
  .ing { display: grid; grid-template-columns: minmax(78px, auto) 1fr; gap: .35rem 1rem; }
  .ing dt { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
  .ing dd { margin: 0; }
  ol.steps-list { list-style: none; padding: 0; margin: 0; counter-reset: s; display: grid; gap: .9rem; }
  ol.steps-list li { counter-increment: s; display: grid; grid-template-columns: 30px 1fr; gap: .8rem; }
  ol.steps-list li::before { content: counter(s); width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-weight: 700; display: grid; place-items: center; font-size: .9rem; }

  .check { display: flex; align-items: center; gap: .75rem; cursor: pointer; min-height: 44px; padding: .15rem 0; }
  .check .tick { margin-top: 0; }
  .check input:checked + .tick { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .check input:focus-visible + .tick { outline: 3px solid var(--focus); outline-offset: 2px; }
  .check input:checked ~ .txt { color: var(--muted); text-decoration: line-through; }
  .check .qty { font-weight: 700; min-width: 4.2rem; font-variant-numeric: tabular-nums; }
  .aisle-title { font-size: 1.15rem; font-weight: 800; padding-bottom: .3rem; border-bottom: 2px solid var(--accent); display: flex; justify-content: space-between; align-items: baseline; }

  /* ----- toast ----- */
  #toast { position: fixed; left: 50%; bottom: calc(1rem + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--bg); padding: .65rem 1.1rem; border-radius: 12px; font-weight: 600; font-size: .92rem; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 80; max-width: calc(100vw - 2rem); text-align: center; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ============================================================
     MOTION (GSAP / ScrollTrigger / Lenis)
     ============================================================ */
  :root { --ease: cubic-bezier(.22, 1, .36, 1); }

  /* Lenis : CSS recommandé */
  html.lenis, html.lenis body { height: auto; }
  .lenis.lenis-smooth { scroll-behavior: auto !important; }
  .lenis.lenis-smooth [data-lenis-prevent] { overscroll-behavior: contain; }
  .lenis.lenis-stopped { overflow: hidden; }
  main:focus { outline: none; }

  /* États initiaux : uniquement si le JS a posé .has-motion (évite le flash avant l'init) */
  .has-motion:not(.motion-ready) #view > *,
  .has-motion:not(.motion-ready) .topbar .shell { opacity: 0; }
  .has-motion .fade-in { animation: none; }

  /* Navbar sticky : fond et ombre = opacity de pseudo-éléments, masquage = transform */
  .topbar { position: sticky; top: 0; z-index: 40; }
  .topbar::before, .topbar::after { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; }
  .topbar::before { background: var(--bg); }
  .topbar::after { box-shadow: 0 8px 20px -8px rgba(0, 0, 0, .28); opacity: 0; }
  .has-motion .topbar { transition: transform .35s var(--ease); }
  .has-motion .topbar::before { opacity: 0; }
  .has-motion .topbar::before, .has-motion .topbar::after { transition: opacity .3s ease; }
  .has-motion .topbar.is-scrolled::before, .has-motion .topbar.is-scrolled::after { opacity: 1; }
  .has-motion .topbar.is-hidden { transform: translateY(calc(-100% - 24px)); }
  .has-motion .topbar .brand { display: inline-block; transform-origin: left center; transition: transform .3s var(--ease); }
  .has-motion .topbar.is-scrolled .brand { transform: scale(.88); }

  /* Titres découpés par mots (masque de révélation) */
  .mw { display: inline-block; overflow: hidden; vertical-align: top; padding: 0 .04em .14em; margin: 0 -.04em -.14em; }
  .mw-i { display: inline-block; }
  [data-count] { font-variant-numeric: tabular-nums; }

  /* Micro-interactions : propriétés individuelles translate / scale (composables avec les transforms GSAP) */
  .opt-card .body { transition: border-color .15s, background-color .15s, translate .2s var(--ease), scale .1s; }
  .opt-card:active .body { scale: .985; }
  .slot { transition: translate .25s var(--ease); }
  @media (hover: hover) and (pointer: fine) {
    .btn:hover:not(:disabled) { translate: 0 -2px; }
    .opt-card:hover .body, .slot:hover { translate: 0 -2px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }

  /* ============================================================
     AJOUTS : navigation, batch, verrous, mode cuisine, minuteurs
     ============================================================ */
  .topnav { display: flex; gap: .2rem; overflow-x: auto; scrollbar-width: none; margin: 0 -.3rem; padding: 0 .3rem; }
  .topnav::-webkit-scrollbar { display: none; }
  .navbtn { background: none; border: 0; padding: .45rem .7rem; border-radius: 10px; font-weight: 600; font-size: .92rem; color: var(--muted); white-space: nowrap; min-height: 40px; }
  .navbtn:hover { background: var(--sage); color: var(--sage-ink); }
  .navbtn[aria-current="page"] { color: var(--ink); background: var(--surface-2); }
  .topbar .shell { gap: .75rem; flex-wrap: wrap; }

  .badge.batch { background: var(--warn-bg); color: var(--warn-ink); }
  .slot.is-locked { border-color: var(--accent); }
  .slot-foot { flex-wrap: wrap; }
  .foot-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 0 .35rem; justify-content: flex-end; }
  .link-btn:disabled { opacity: .4; cursor: not-allowed; text-decoration: none; }
  .icon-btn { display: inline-flex; align-items: center; gap: .3rem; }
  .icon-btn[aria-pressed="true"] { color: var(--ink); }
  @media (max-width: 420px) { .hide-xs { display: none; } }
  .day-total { border-top: 1px dashed var(--line); padding-top: .7rem; }
  .mini { height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin-top: .45rem; }
  .mini > span { display: block; height: 100%; background: var(--accent); border-radius: 99px; }

  .eater { display: grid; grid-template-columns: auto 1fr auto; gap: .75rem; align-items: center; padding: .5rem .8rem; border: 1.5px solid var(--line); border-radius: 14px; background: var(--surface); }

/* ---------- index des recettes (les recettes perso sont ajoutées à RECIPES) ---------- */
let BY_ID = new Map();

const totalTime = r => r.prepTime + r.cookTime;

const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");

function shuffle(arr, rng = Math.random) {
  const a = arr.slice();
  for (let k = a.length - 1; k > 0; k--) {
    const j = Math.floor(rng() * (k + 1));
    [a[k], a[j]] = [a[j], a[k]];
  }
  return a;
}

/* ---------- configuration : convives, créneaux ---------- */
const headsOf = cfg => cfg.eaters.length;
const portionsOf = cfg => cfg.eaters.reduce((a, b) => a + b, 0);

function slotList(days, extras) {
  const out = [];
  DAYS.forEach((_, d) => {
    const m = days[d];
    if (!m) return;
    if (extras && extras.breakfast) out.push({ day: d, meal: "breakfast" });
    if (m === "lunch" || m === "both") out.push({ day: d, meal: "lunch" });
    if (extras && extras.snack) out.push({ day: d, meal: "snack" });
    if (m === "dinner" || m === "both") out.push({ day: d, meal: "dinner" });
  });
  return out;
}
const slotsOf = cfg => slotList(cfg.days, cfg.extras);
function budgetMax(cfg) {
  return Math.min(1500, Math.max(250, Math.ceil(slotsOf(cfg).length * portionsOf(cfg) * 8 / 10) * 10));
}

/* ---------- filtres ---------- */
function eligible(r, cfg) {
  return cfg.diets.every(d => r.diet.includes(d)) && r.equipments.every(e => cfg.equip.includes(e));
}
function matchesStyle(r, s) {
  if (r.category === s) return true;
  if (s === "express") return totalTime(r) <= 20;
  if (s === "economique") return r.costPerPerson <= 2.3;
  if (s === "vegan") return r.diet.includes("vegan");
  if (s === "proteine") return r.protein >= 40;
  return false;
}
/* Les styles ne s'appliquent qu'aux repas : un petit-déjeuner n'est jamais « hors style » */
function prefersStyle(r, cfg) {
  if (kindOf(r) !== "main") return true;
  return !cfg.styles.length || cfg.styles.some(s => matchesStyle(r, s));
}
function poolFor(cfg, kind = "main") { return RECIPES.filter(r => kindOf(r) === kind && eligible(r, cfg)); }

/* ---------- objectifs journaliers ---------- */
function dayShares(slots) {
  /* part fixe de l'objectif journalier visée par repas (les repas non planifiés ne sont pas redistribués) */
  return slots.map(s => MEAL_SHARE[s.meal]);
}
function fitScore(r, cfg, share) {
  const t = cfg.targets;
  let s = 0, n = 0;
  if (t.kcal) { s += Math.abs(r.calories - t.kcal * share) / (t.kcal * share); n++; }
  if (t.protein) { s += Math.abs(r.protein - t.protein * share) / (t.protein * share); n++; }
  return n ? s / n : 0;
}
/* Choix final parmi les candidats : proches de l'objectif si défini, favoris pondérés ×3 */
function choose(cands, cfg, share, favs, rng) {
  if (!cands.length) return null;
  let src = cands;
  if (cfg.targets.kcal || cfg.targets.protein) {
    src = cands.map(r => [r, fitScore(r, cfg, share)]).sort((a, b) => a[1] - b[1]).map(x => x[0]);
    src = src.slice(0, Math.max(3, Math.ceil(src.length * 0.4)));
  }
  if (cfg.useFavs && favs && favs.size) {
    const w = src.map(r => favs.has(r.id) ? 3 : 1);
    let x = rng() * w.reduce((a, b) => a + b, 0);
    for (let k = 0; k < src.length; k++) { x -= w[k]; if (x < 0) return src[k]; }
    return src[src.length - 1];
  }
  return src[Math.floor(rng() * src.length)];
}

/* ---------- moteur de recommandation ---------- */
function buildPlan(cfg, rng = Math.random, prev = null, favs = new Set()) {
  const slots = slotsOf(cfg), N = slots.length, P = portionsOf(cfg), B = cfg.budget;
  const share = dayShares(slots);
  const out = slots.map(s => ({ day: s.day, meal: s.meal, rid: null, locked: false }));

  /* recettes verrouillées de l'ancien planning : conservées si le créneau existe toujours */
  const locks = new Map();
  if (prev) prev.slots.forEach(s => { const r = s.locked && s.rid && recipeById(s.rid); if (r) locks.set(s.day + "-" + s.meal, r); });
  let spent = 0;
  const used = new Set();
  out.forEach(sl => {
    const r = locks.get(sl.day + "-" + sl.meal);
    if (r && kindOf(r) === slotKind(sl.meal)) { sl.rid = r.id; sl.locked = true; spent += r.costPerPerson * P; used.add(r.id); }
  });

  const pools = { main: poolFor(cfg, "main"), breakfast: poolFor(cfg, "breakfast"), snack: poolFor(cfg, "snack") };
  const batchPool = pools.main.filter(isBatchable);
  const batchActive = cfg.batch.on && batchPool.length > 0;
  const minOf = arr => arr.length ? Math.min(...arr.map(r => r.costPerPerson)) : 0;
  const minCost = { main: minOf(batchActive ? batchPool : pools.main), breakfast: minOf(pools.breakfast), snack: minOf(pools.snack) };
  const free = k => out[k].rid === null;
  let overBudget = false;

  /* budget minimal à réserver pour les créneaux restants (au plus bas prix possible) */
  const reserve = (restIdx, exclude) => {
    const cnt = { main: 0, breakfast: 0, snack: 0 };
    restIdx.forEach(j => { cnt[slotKind(slots[j].meal)]++; });
    let tot = minCost.breakfast * cnt.breakfast + minCost.snack * cnt.snack;
    if (cnt.main) {
      if (batchActive) tot += minCost.main * cnt.main;
      else tot += pools.main.filter(r => !used.has(r.id) && r !== exclude).map(r => r.costPerPerson).sort((a, b) => a - b).slice(0, cnt.main).reduce((a, b) => a + b, 0);
    }
    return tot * P;
  };

  for (let k = 0; k < N; k++) {
    if (!free(k)) continue;
    const kind = slotKind(slots[k].meal);
    const wLeft = out.reduce((a, sl, j) => a + (j >= k && sl.rid === null ? MEAL_WEIGHT[sl.meal] : 0), 0);
    const target = (B - spent) * MEAL_WEIGHT[slots[k].meal] / Math.max(wLeft, 0.01);
    let pick = null, group = [k], src;

    if (kind === "main" && batchActive) {
      /* un plat cuisiné en une fois pour plusieurs repas consécutifs, dans la limite de sa conservation */
      const groupFor = r => {
        const cap = Math.min(cfg.batch.size, r.keep), g = [k];
        for (let j = k + 1; j < N && g.length < cap; j++) {
          if (!free(j) || slotKind(slots[j].meal) !== "main") continue;
          if (slots[j].day - slots[k].day >= r.keep) break;
          g.push(j);
        }
        return g;
      };
      src = batchPool.filter(r => !used.has(r.id));
      if (!src.length) src = batchPool;
      const ok = r => {
        const g = groupFor(r), rest = [];
        for (let j = k + 1; j < N; j++) if (free(j) && !g.includes(j)) rest.push(j);
        return spent + r.costPerPerson * P * g.length + reserve(rest, r) <= B + 1e-9;
      };
      let cands = src.filter(r => prefersStyle(r, cfg) && ok(r));
      if (!cands.length) cands = src.filter(ok);
      if (!cands.length) { pick = src.slice().sort((a, b) => a.costPerPerson - b.costPerPerson)[0]; overBudget = true; }
      else {
        const bal = cands.filter(r => r.costPerPerson * P <= target * 1.3);
        pick = choose(bal.length ? bal : cands, cfg, share[k], favs, rng);
      }
      group = groupFor(pick);
    } else {
      if (kind === "main") src = pools.main.filter(r => !used.has(r.id));
      else { src = pools[kind]; const fresh = src.filter(r => !used.has(r.id)); if (fresh.length) src = fresh; }
      if (!src.length) continue;                         /* créneau laissé vide : plus de recette compatible */
      const rest = [];
      for (let j = k + 1; j < N; j++) if (free(j)) rest.push(j);
      const ok = r => spent + r.costPerPerson * P + reserve(rest, r) <= B + 1e-9;
      let cands = src.filter(r => prefersStyle(r, cfg) && ok(r));
      if (!cands.length) cands = src.filter(ok);
      if (!cands.length) { pick = src.slice().sort((a, b) => a.costPerPerson - b.costPerPerson)[0]; overBudget = true; }
      else {
        const bal = cands.filter(r => r.costPerPerson * P <= target * 1.3);
        pick = choose(bal.length ? bal : cands, cfg, share[k], favs, rng);
      }
    }
    group.forEach(j => { out[j].rid = pick.id; });
    spent += pick.costPerPerson * P * group.length;
    used.add(pick.id);
  }
  return { slots: out, batch: batchActive, batchFallback: cfg.batch.on && !batchActive, overBudget: overBudget || spent > B + 1e-9 };
}

function planCost(plan, P) {
  return plan.slots.reduce((s, sl) => s + (sl.rid ? recipeById(sl.rid).costPerPerson * P : 0), 0);
}

/* Remplace la recette d'un créneau : renvoie le nouvel id ou null */
function pickReplacement(plan, idx, cfg, rng = Math.random, favs = new Set()) {
  const P = portionsOf(cfg), B = cfg.budget, sl = plan.slots[idx], kind = slotKind(sl.meal);
  const used = new Set(plan.slots.map(s => s.rid).filter(Boolean));
  const cur = sl.rid ? recipeById(sl.rid) : null;
  const base = planCost(plan, P) - (cur ? cur.costPerPerson * P : 0);
  let alts = poolFor(cfg, kind).filter(r => r.id !== sl.rid && !used.has(r.id));
  if (!alts.length && kind !== "main") alts = poolFor(cfg, kind).filter(r => r.id !== sl.rid);
  const fits = alts.filter(r => base + r.costPerPerson * P <= B + 1e-9);
  const preferred = fits.filter(r => prefersStyle(r, cfg));
  const src = preferred.length ? preferred : fits;
  if (!src.length) return { id: null, reason: alts.length ? "budget" : "pool" };
  const share = dayShares(plan.slots)[idx];
  return { id: choose(src, cfg, share, favs, rng).id, reason: null };
}

/* Aide quand le filtrage est trop strict */
function relaxHints(cfg) {
  const current = poolFor(cfg).length;
  const hints = [];
  cfg.diets.forEach(d => {
    const c2 = { ...cfg, diets: cfg.diets.filter(x => x !== d) };
    hints.push({ label: "retirer « " + DIET_LABEL[d] + " »", count: poolFor(c2).length });
  });
  EQUIP.filter(e => !cfg.equip.includes(e.id)).forEach(e => {
    const c2 = { ...cfg, equip: cfg.equip.concat(e.id) };
    hints.push({ label: "ajouter « " + e.label + " »", count: poolFor(c2).length });
  });
  return hints.filter(h => h.count > current).sort((a, b) => b.count - a.count).slice(0, 3);
}

/* Totaux par jour (pour une portion standard) */
function dayTotals(plan) {
  const m = new Map();
  plan.slots.forEach(s => {
    if (!s.rid) return;
    const r = recipeById(s.rid), t = m.get(s.day) || { kcal: 0, protein: 0 };
    t.kcal += r.calories; t.protein += r.protein;
    m.set(s.day, t);
  });
  return m;
}
/* Plats cuisinés pour plusieurs repas (session batch) */
function batchSession(plan) {
  const cnt = new Map();
  plan.slots.forEach(s => { if (s.rid && slotKind(s.meal) === "main") cnt.set(s.rid, (cnt.get(s.rid) || 0) + 1); });
  return [...cnt].filter(([, n]) => n > 1).map(([id, n]) => ({ r: recipeById(id), n }));
}

/* ---------- quantités ---------- */
const FR = new Intl.NumberFormat("fr-FR", { maximumFractionDigits: 1 });
const FRC = new Intl.NumberFormat("fr-FR", { maximumFractionDigits: 2 });
const FRI = new Intl.NumberFormat("fr-FR", { maximumFractionDigits: 0 });
function eur(n) {
  const whole = Math.abs(n - Math.round(n)) < 0.005;
  return new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR", minimumFractionDigits: whole ? 0 : 2, maximumFractionDigits: whole ? 0 : 2 }).format(n);
}
function fraction(q) {
  const r = Math.round(q * 4) / 4;
  const whole = Math.floor(r), f = r - whole;
  const sym = { 0.25: "¼", 0.5: "½", 0.75: "¾" }[f] || "";
  if (!whole && !sym) return "¼";
  return (whole ? String(whole) : "") + (whole && sym ? " " : "") + sym;
}
const UNIT_LABEL = { càc: "c. à café", càs: "c. à soupe", gousse: "gousse", tranche: "tranche" };
const PREP_STOP = new Set(["de", "du", "des", "à", "au", "aux", "en", "et", "sans", "avec"]);
function plural(name, q) {
  if (q <= 1) return name;
  let stop = false;
  return name.split(" ").map(w => {
    if (stop) return w;
    if (PREP_STOP.has(w.toLowerCase()) || /^d['’]/i.test(w) || w.startsWith("(")) { stop = true; return w; }
    return /[sxz]$/i.test(w) ? w : w + "s";
  }).join(" ");
}
function fmtRecipeQty(q, unit) {
  if (unit === "g" || unit === "ml") {
    const step = q >= 50 ? 5 : 1;
    const v = Math.max(step, Math.round(q / step) * step);
    if (v >= 1000) return FRC.format(v / 1000) + (unit === "g" ? " kg" : " L");
    return v + " " + unit;
  }
  const f = fraction(q);
  const n = Math.round(q * 4) / 4;
  if (unit === "pièce") return f;
  const lab = UNIT_LABEL[unit] || unit;
  const labP = (unit === "gousse" || unit === "tranche") && n > 1 ? lab + "s" : lab;
  return f + " " + labP;
}
function recipeIngredientLine(ing, mult) {
  const q = ing.baseQty * mult;
  const n = Math.round(q * 4) / 4;
  return { qty: fmtRecipeQty(q, ing.unit), name: ing.unit === "pièce" ? plural(ing.item, n) : ing.item };
}

function aisleOf(name) {

  if (/poulet|dinde|bœuf|boeuf|saumon|cabillaud|colin|crevette|lardon|jambon|saucisse|viande|poisson|agneau|steak|pilon|merguez|dorade|truite|sardine/.test(n)) return "Boucherie / Poissonnerie";

const BASICS_RE = /huile|vinaigre|paprika|cumin|curry|curcuma|origan|thym|piment|coriandre moulue|cannelle|ras el hanout|garam|moutarde|farine|sauce soja|tamari|ketchup|miel|bouillon|fécule|chapelure/i;
function fmtShopQty(q, unit) {
  if (unit === "g" || unit === "ml") {
    const step = q >= 100 ? 10 : 5;
    const v = Math.max(step, Math.ceil(q / step) * step);
    if (v >= 1000) return FRC.format(v / 1000) + (unit === "g" ? " kg" : " L");
    return v + " " + unit;
  }
  const n = Math.ceil(q - 1e-9);
  if (unit === "pièce") return String(n);
  const lab = UNIT_LABEL[unit] || unit;
  return n + " " + ((unit === "gousse" || unit === "tranche") && n > 1 ? lab + "s" : lab);
}
function buildShopping(plan, P) {
  const acc = new Map();
  plan.slots.forEach(sl => {
    if (!sl.rid) return;
    recipeById(sl.rid).ingredients.forEach(ing => {
      const key = ing.item.toLowerCase() + "|" + ing.unit;
      const cur = acc.get(key) || { item: ing.item, unit: ing.unit, qty: 0 };
      cur.qty += ing.baseQty * P;
      acc.set(key, cur);
    });
  });
  const groups = AISLES.map(a => ({ aisle: a, items: [] }));
  acc.forEach((v, key) => {
    const count = v.unit === "pièce" ? Math.ceil(v.qty - 1e-9) : v.qty;
    const g = groups.find(x => x.aisle === aisleOf(v.item));
    g.items.push({ key, name: v.unit === "pièce" ? plural(v.item, count) : v.item, qty: fmtShopQty(v.qty, v.unit) });
  });
  groups.forEach(g => g.items.sort((a, b) => a.name.localeCompare(b.name, "fr")));
  return groups.filter(g => g.items.length);
}
function shoppingText(groups, checked, pantry, header) {
  const lines = [header, ""];
  groups.forEach(g => {
    const items = g.items.filter(it => !pantry.has(it.key));
    if (!items.length) return;
    lines.push(g.aisle);
    items.forEach(it => lines.push("[" + (checked.has(it.key) ? "x" : " ") + "] " + it.qty + " " + it.name));
    lines.push("");
  });
  return lines.join("\n").trim();
}

/* ---------- indicateur de budget ---------- */
function budgetLevel(c) {
  if (c < 3) return { id: "eco", label: "Éco", text: "Moins de 3 € par repas et par personne : légumineuses, œufs, pâtes et riz au menu." };
  if (c <= 6) return { id: "equi", label: "Équilibré", text: "Entre 3 € et 6 € : viande, poisson et légumes frais en rotation." };
  return { id: "conf", label: "Confort", text: "Plus de 6 € : de la marge pour les pièces de viande et de poisson." };
}

/* ---------- minuteurs : extraction depuis le texte d'une étape ---------- */
function parseTimers(text) {
  const out = [], seen = new Set();
  const add = (sec, label) => { if (sec > 0 && !seen.has(sec)) { seen.add(sec); out.push({ sec, label }); } };
  let s = text;
  /* « 1 minute 30 au micro-ondes », « 6 minutes et 30 secondes » */
  s = s.replace(/(\d+)\s*minutes?\s*(?:et\s*)?(\d{1,2})\s*(?:secondes?\b|(?=\s*(?:au\s|à\s*\d)))/gi, (m, a, b) => { add(+a * 60 + +b, a + " min " + b + " s"); return " "; });
  /* « 10 minutes », « 10 à 12 minutes » (on prend la borne basse), « 45 secondes » */
  s.replace(/(\d+)(?:\s*(?:à|-)\s*(\d+))?\s*(minutes?|min\b|secondes?)/gi, (m, a, b, u) => {
    const sec = /^s/i.test(u) ? +a : +a * 60;
    add(sec, fmtDuration(sec));
    return m;
  });
  return out;
}
function fmtDuration(sec) {
  if (sec >= 60 && sec % 60 === 0) return (sec / 60) + " min";
  if (sec >= 60) return Math.floor(sec / 60) + " min " + (sec % 60) + " s";
  return sec + " s";
}
function fmtClock(sec) {
  const m = Math.floor(sec / 60), s = sec % 60;
  return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
}

/* ---------- saisie des recettes perso ---------- */
const UNIT_ALIAS = { g: "g", gr: "g", kg: "kg", ml: "ml", cl: "cl", l: "l", "càc": "càc", cac: "càc", "càs": "càs", cas: "càs", "pièce": "pièce", piece: "pièce", pieces: "pièce", "pièces": "pièce", gousse: "gousse", gousses: "gousse", tranche: "tranche", tranches: "tranche" };
function parseQty(tok) {
  const t = tok.replace(",", ".");
  const f = t.match(/^(\d+)\/(\d+)$/);
  if (f) return +f[2] ? +f[1] / +f[2] : NaN;
  return /^\d+(\.\d+)?$/.test(t) ? parseFloat(t) : NaN;
}
/* « 150 g Blanc de poulet », « 2 Œuf », « 1/2 càc Cumin » (quantités pour une personne) */
function parseIngredientLine(line) {
  const toks = line.trim().split(/\s+/);
  if (toks.length < 2) return null;
  const q = parseQty(toks[0]);
  if (!Number.isFinite(q) || q <= 0) return null;
  let unit = "pièce", rest = toks.slice(1);
  const u = UNIT_ALIAS[norm(rest[0]).replace(/\./g, "")] && rest.length > 1 ? UNIT_ALIAS[norm(rest[0]).replace(/\./g, "")] : null;
  let qty = q;
  if (u) {
    rest = rest.slice(1);
    if (u === "kg") { unit = "g"; qty = q * 1000; }
    else if (u === "l") { unit = "ml"; qty = q * 1000; }
    else if (u === "cl") { unit = "ml"; qty = q * 10; }
    else unit = u;
  }
  const item = rest.join(" ").trim();
  if (!item) return null;
  return { item: item.charAt(0).toUpperCase() + item.slice(1), baseQty: Math.round(qty * 100) / 100, unit };
}
function ingredientToLine(g) {
  return (g.unit === "pièce" ? FRC.format(g.baseQty) : FRC.format(g.baseQty) + " " + g.unit) + " " + g.item;
}
function withImplied(tags) {
  const s = new Set(tags);
  if (s.has("vegan")) ["vegetarien", "sans-lactose", "sans-porc", "halal"].forEach(t => s.add(t));
  if (s.has("vegetarien")) s.add("sans-porc");
  return [...s];
}
function cleanRecipe(x) {
  if (!x || typeof x !== "object") return null;
  const str = (v, n) => typeof v === "string" ? v.trim().slice(0, n) : "";
  const id = typeof x.id === "string" && /^u[a-z0-9]{4,20}$/.test(x.id) ? x.id : null;
  const name = str(x.name, 80);
  if (!id || !name) return null;
  const ingredients = (Array.isArray(x.ingredients) ? x.ingredients : []).slice(0, 40).map(g => {
    const item = str(g && g.item, 60), q = Number(g && g.baseQty), unit = g && UNITS.includes(g.unit) ? g.unit : null;
    return item && Number.isFinite(q) && q > 0 && q <= 5000 && unit ? { item, baseQty: Math.round(q * 100) / 100, unit } : null;
  }).filter(Boolean);
  const instructions = (Array.isArray(x.instructions) ? x.instructions : []).slice(0, 25).map(s => str(s, 400)).filter(Boolean);
  if (!ingredients.length || !instructions.length) return null;
  const kind = ["main", "breakfast", "snack"].includes(x.kind) ? x.kind : "main";
  const r = {
    id, custom: true, kind, name, category: STYLES.some(s => s.id === x.category) ? x.category : "sain",
    diet: withImplied((Array.isArray(x.diet) ? x.diet : []).filter(t => TAGS.includes(t))),
    equipments: (Array.isArray(x.equipments) ? x.equipments : []).filter(e => EQUIP.some(q => q.id === e)),
    prepTime: Math.round(numIn(x.prepTime, 0, 600, 10)), cookTime: Math.round(numIn(x.cookTime, 0, 600, 10)),
    costPerPerson: Math.round(numIn(x.costPerPerson, 0, 50, 2) * 100) / 100,
    calories: Math.round(numIn(x.calories, 0, 3000, 500)), protein: Math.round(numIn(x.protein, 0, 300, 20)),
    ingredients, instructions

  const keep = Math.round(numIn(x.keep, 0, 5, 0));
  if (keep > 0 && kind === "main") r.keep = keep;
  return r;
}

/* ---------- normalisation : tout ce qui vient du stockage ou d'un import est non fiable ---------- */
const roundFactor = f => { const n = Number(f); return Number.isFinite(n) ? Math.round(Math.min(2, Math.max(0.5, n)) * 4) / 4 : null; };
const cleanTarget = (v, lo, hi) => { const n = Number(v); return v !== null && v !== "" && Number.isFinite(n) && n >= lo && n <= hi ? Math.round(n) : null; };
function cleanCfg(x) {
  const d = DEFAULT_CFG();
  if (!x || typeof x !== "object") return d;
  if (x.days && typeof x.days === "object") {
    d.days = {};
    for (let k = 0; k < 7; k++) { const v = x.days[k]; if (v === "lunch" || v === "dinner" || v === "both") d.days[k] = v; }
  }
  d.extras = { breakfast: !!(x.extras && x.extras.breakfast === true), snack: !!(x.extras && x.extras.snack === true) };
  if (Array.isArray(x.eaters)) {
    const e = x.eaters.slice(0, 8).map(roundFactor).filter(f => f !== null);
    if (e.length) d.eaters = e;
  }
  d.budget = Math.round(numIn(x.budget, 20, 1500, 80));
  const t = x.targets && typeof x.targets === "object" ? x.targets : {};
  d.targets = { kcal: cleanTarget(t.kcal, 1000, 6000), protein: cleanTarget(t.protein, 20, 400) };
  const pick = (arr, list) => Array.isArray(arr) ? list.filter(id => arr.includes(id)) : [];
  d.styles = pick(x.styles, STYLES.map(s => s.id));
  d.diets = pick(x.diets, DIETS.map(s => s.id));
  d.equip = Array.isArray(x.equip) ? pick(x.equip, EQUIP.map(s => s.id)) : ["base"];
  d.batch = { on: !!(x.batch && x.batch.on === true), size: x.batch && x.batch.size === 2 ? 2 : 3 };
  d.useFavs = x.useFavs !== false;
  return d;
}
function cleanPlan(x) {
  if (!x || typeof x !== "object" || !Array.isArray(x.slots)) return null;
  const seen = new Set(), slots = [];
  x.slots.slice(0, 40).forEach(s => {
    if (!s || !Number.isInteger(s.day) || s.day < 0 || s.day > 6 || !MEAL_ORDER.includes(s.meal)) return;
    const key = s.day + "-" + s.meal;
    if (seen.has(key)) return;
    seen.add(key);
    const r = typeof s.rid === "string" ? recipeById(s.rid) : null;
    const ok = r && kindOf(r) === slotKind(s.meal);
    slots.push({ day: s.day, meal: s.meal, rid: ok ? r.id : null, locked: ok && s.locked === true });
  });
  if (!slots.length) return null;
  slots.sort((a, b) => a.day - b.day || MEAL_ORDER.indexOf(a.meal) - MEAL_ORDER.indexOf(b.meal));
  return {
    id: typeof x.id === "string" && /^[a-z0-9]{4,24}$/.test(x.id) ? x.id : uid(),
    ts: Number.isFinite(Number(x.ts)) ? Number(x.ts) : Date.now(),
    cfg: cleanCfg(x.cfg), slots,
    batch: x.batch === true, batchFallback: x.batchFallback === true, overBudget: x.overBudget === true

}
function applyMine(list) {
  for (let k = RECIPES.length - 1; k >= 0; k--) if (RECIPES[k].custom) RECIPES.splice(k, 1);
  const seen = new Set();
  list.forEach(r => { if (!seen.has(r.id) && !RECIPES.some(b => b.id === r.id)) { seen.add(r.id); RECIPES.push(r); } });
  reindex();
}
function normalizeAll(d) {

  const strs = (a, n) => (Array.isArray(a) ? a : []).filter(s => typeof s === "string" && s.length <= 120).slice(0, n);
  return {
    mine: RECIPES.filter(r => r.custom),
    cfg: cleanCfg(d.cfg),
    plan: cleanPlan(d.plan),
    hist: (Array.isArray(d.hist) ? d.hist : []).slice(0, 15).map(cleanPlan).filter(Boolean),
    favs: new Set(strs(d.favs, 500).filter(id => BY_ID.has(id))),
    pantry: new Set(strs(d.pantry, 500)),

}

function minNeeded(cfg) {

  const m = { main: minK("main"), breakfast: minK("breakfast"), snack: minK("snack") };
  return slotsOf(cfg).reduce((s, sl) => s + m[slotKind(sl.meal)], 0) * portionsOf(cfg);
}
function syncBudget(skipInputs) {
  const cfg = state.cfg, { budget } = cfg, P = portionsOf(cfg), slots = slotsOf(cfg);

  else if (document.activeElement !== $("#budget-num")) $("#budget-num").value = budget;
  $("#b-meals").textContent = `${slots.length} ${plur(slots.length, "repas", "repas")} pour ${FR.format(P)} ${plur(P, "portion", "portions")}`;

function poolInfo() {
  const cfg = state.cfg, slots = slotsOf(cfg);
  const N = slots.filter(s => slotKind(s.meal) === "main").length;
  const pool = poolFor(cfg), n = pool.length;
  const lines = []; let sev = 0;
  const add = (lvl, html) => { sev = Math.max(sev, lvl); lines.push(html); };
  const hint = () => { const h = relaxHints(cfg); return h.length ? " Pour élargir : " + h.map(x => `${x.label} (${x.count} recettes)`).join(", ") + "." : ""; };
  if (N) {
    if (n === 0) add(2, `<strong>Aucune recette de repas ne correspond à ces filtres.</strong>${hint() || " Retirez un filtre pour élargir le choix."}`);
    else if (n < N && !cfg.batch.on) add(1, `<strong>${n} ${plur(n, "recette compatible", "recettes compatibles")} pour ${N} repas.</strong> Une recette n'est jamais proposée deux fois hors batch : ${N - n} ${plur(N - n, "repas resterait vide", "repas resteraient vides")}.${hint()}`);
    else if (cfg.styles.length) {
      const s = pool.filter(r => prefersStyle(r, cfg)).length;
      if (s < N && !cfg.batch.on) add(1, `<strong>${n} recettes compatibles, dont ${s} dans les styles choisis.</strong> Des recettes d'autres styles compléteront le planning pour ${N} repas.`);
      else add(0, `<strong>${n} recettes compatibles</strong>, dont ${s} dans les styles choisis.`);
    } else add(0, `<strong>${n} recettes compatibles</strong> avec vos filtres et votre matériel.`);
    if (cfg.batch.on) {
      const b = pool.filter(isBatchable).length;
      if (!b) add(1, `<strong>Aucune recette compatible ne se conserve assez longtemps pour le batch cooking.</strong> Le planning sera généré sans batch.`);
      else add(0, `Batch cooking : ${b} ${plur(b, "recette compatible", "recettes compatibles")} se prête${b > 1 ? "nt" : ""} à la préparation à l'avance.`);
    }
  }
  [["breakfast", "petit-déjeuner", "petits-déjeuners"], ["snack", "collation", "collations"]].forEach(([k, one, many]) => {
    if (!cfg.extras[k]) return;
    const c = poolFor(cfg, k).length, cnt = slots.filter(s => s.meal === k).length;
    if (!c) add(1, `<strong>Aucun ${one} compatible</strong> avec ces filtres : ces créneaux resteront vides.`);
    else if (c < cnt) add(0, `${c} ${plur(c, one, many)} compatible${c > 1 ? "s" : ""} pour ${cnt} créneaux : certains reviendront.`);
  });
  if (!lines.length) lines.push("Aucun repas à planifier.");
  return { cls: ["info", "warn", "err"][sev], html: lines.join("<br>") };
}

function badgesFor(r, cfg) {
  const prio = [...new Set([...cfg.diets, "vegan", "vegetarien"])];
  return prio.filter(t => r.diet.includes(t)).slice(0, 3).map(t => `<span class="badge accent">${DIET_LABEL[t]}</span>`).join("");

/* pour chaque plat servi plusieurs fois (batch) : quel créneau le cuisine, lesquels réchauffent */
function batchRoles(plan) {
  const first = new Map(), roles = new Map();
  plan.slots.forEach((sl, idx) => {
    if (!sl.rid || slotKind(sl.meal) !== "main") return;
    if (!first.has(sl.rid)) first.set(sl.rid, idx);
  });
  const total = new Map();
  plan.slots.forEach(sl => { if (sl.rid && slotKind(sl.meal) === "main") total.set(sl.rid, (total.get(sl.rid) || 0) + 1); });
  plan.slots.forEach((sl, idx) => {
    if (!sl.rid || slotKind(sl.meal) !== "main" || total.get(sl.rid) < 2) return;
    const f = first.get(sl.rid);
    roles.set(idx, f === idx ? { cook: true, n: total.get(sl.rid) } : { cook: false, from: plan.slots[f] });
  });
  return roles;
}
const slotLabel = sl => `${DAYS[sl.day]}, ${MEAL_LABEL[sl.meal].toLowerCase()}`;

    : `<span class="badge batch">Restes du ${DAYS[role.from.day].toLowerCase()}</span>`) : "";
  const fav = state.favs.has(r.id), locked = sl.locked;
  return `<li class="slot ${locked ? "is-locked" : ""}">
    <button type="button" class="slot-open" data-act="open" data-i="${idx}" aria-haspopup="dialog" aria-label="Voir la recette ${esc(r.name)}, ${esc(label)}">

        <span class="flex flex-wrap gap-1 mt-2">${roleTag}${locked ? '<span class="badge accent">Verrouillé</span>' : ""}${badgesFor(r, pc)}</span>
      </span>

        <button type="button" class="link-btn icon-btn" data-act="fav" data-id="${r.id}" aria-pressed="${fav}" aria-label="${fav ? "Retirer des favoris" : "Ajouter aux favoris"} : ${esc(r.name)}">${STAR(fav)}<span class="hide-xs">${fav ? "Favori" : "Favori"}</span></button>

function renderPlan(focusSel, opts = {}) {
  const plan = state.plan, pc = plan.cfg, P = portionsOf(pc), B = pc.budget;
  const filled = plan.slots.filter(s => R(s.rid));
  const missing = plan.slots.length - filled.length;
  const cost = planCost(plan, P);
  const over = cost > B + 0.005;
  const ratio = Math.min(1, cost / B);
  const wsum = filled.reduce((s, x) => s + MEAL_WEIGHT[x.meal], 0);
  const perMeal = wsum ? cost / (wsum * P) : 0;
  const lvl = budgetLevel(perMeal);
  const tot = dayTotals(plan), days = [...new Set(plan.slots.map(s => s.day))];
  const daysWithFood = days.filter(d => tot.has(d));
  const hasExtras = pc.extras.breakfast || pc.extras.snack;
  let f1, f2;
  if (hasExtras && daysWithFood.length) {
    f1 = [Math.round(daysWithFood.reduce((s, d) => s + tot.get(d).kcal, 0) / daysWithFood.length), "kcal", "par jour planifié, portion standard"];
    f2 = [Math.round(daysWithFood.reduce((s, d) => s + tot.get(d).protein, 0) / daysWithFood.length), "g", "de protéines par jour planifié"];
  } else {
    const n = filled.length || 1;
    f1 = [Math.round(filled.reduce((s, x) => s + R(x.rid).calories, 0) / n), "kcal", "par repas et par portion, en moyenne"];
    f2 = [Math.round(filled.reduce((s, x) => s + R(x.rid).protein, 0) / n), "g", "de protéines par repas, en moyenne"];
  }
  const fallback = pc.styles.length ? filled.filter(s => kindOf(R(s.rid)) === "main" && !prefersStyle(R(s.rid), pc)).length : 0;
  const mainSlots = plan.slots.filter(s => slotKind(s.meal) === "main").length;
  const poolSize = poolFor(pc).length;
  const roles = batchRoles(plan);
  const sessions = batchSession(plan);
  const nLocks = plan.slots.filter(s => s.locked).length;

  const alerts = [];
  if (over) {
    const need = poolFor(pc).map(r => r.costPerPerson).sort((a, b) => a - b).slice(0, mainSlots).reduce((s, c) => s + c, 0) * P;
    alerts.push(`<div class="alert err" role="alert"><strong>Budget dépassé de ${eur(cost - B)}.</strong> ${need ? `Avec ces filtres, ${mainSlots} ${plur(mainSlots, "repas coûte", "repas coûtent")} au minimum environ ${eur(need)} pour ${FR.format(P)} ${plur(P, "portion", "portions")}.` : ""} Augmentez le budget, réduisez le nombre de repas ou déverrouillez des recettes coûteuses.</div>`);
  }
  if (missing) {
    const h = relaxHints(pc);
    alerts.push(`<div class="alert warn" role="status"><strong>${missing} ${plur(missing, "créneau sans recette", "créneaux sans recette")}.</strong> Seules ${poolSize} ${plur(poolSize, "recette de repas respecte", "recettes de repas respectent")} vos filtres, et aucune n'est proposée deux fois hors batch.${h.length ? " Pour élargir : " + h.map(x => `${x.label} (${x.count} recettes)`).join(", ") + "." : ""}</div>`);
  }
  if (fallback) alerts.push(`<div class="alert warn" role="status"><strong>${fallback} ${plur(fallback, "recette sort", "recettes sortent")} des styles choisis.</strong> Il n'y avait pas assez de recettes dans ces styles pour remplir tout le planning.</div>`);
  if (plan.batchFallback) alerts.push(`<div class="alert warn" role="status"><strong>Batch cooking non appliqué.</strong> Aucune recette compatible avec vos filtres ne se conserve assez longtemps.</div>`);
  if (pc.diets.includes("halal")) alerts.push(`<div class="alert info"><strong>Halal :</strong> les recettes sont sans porc ni alcool. Choisissez de la viande certifiée halal en magasin.</div>`);

  const dayTargets = pc.targets.kcal || pc.targets.protein;
  const cards = days.map(d => {
    const t = tot.get(d);
    let totalLine = "";
    if (t) {
      const parts = [`<b>${FRI.format(t.kcal)} kcal</b>`, `<b>${FRI.format(t.protein)} g</b> de protéines`];
      let bar = "";
      if (dayTargets) {
        const pk = pc.targets.kcal ? t.kcal / pc.targets.kcal : null, pp = pc.targets.protein ? t.protein / pc.targets.protein : null;
        const main = pk !== null ? pk : pp;
        bar = `<div class="mini" role="img" aria-label="${Math.round(main * 100)} % de l'objectif du jour"><span style="width:${Math.min(100, main * 100)}%"></span></div>
          <p class="text-xs muted mt-1">${pk !== null ? `${Math.round(pk * 100)} % de ${FRI.format(pc.targets.kcal)} kcal` : ""}${pk !== null && pp !== null ? " · " : ""}${pp !== null ? `${Math.round(pp * 100)} % de ${pc.targets.protein} g de protéines` : ""}</p>`;
      }
      totalLine = `<div class="day-total"><p class="text-sm">Total du jour (portion standard) : ${parts.join(" · ")}</p>${bar}</div>`;
    }
    return `
    <article class="day-card" aria-labelledby="day-${d}">
      <h2 id="day-${d}" class="day-name">${DAYS[d]}</h2>
      <ul class="list-none p-0 m-0 grid gap-3">
        ${plan.slots.map((sl, idx) => sl.day === d ? slotHTML(plan, sl, idx, roles) : "").join("")}
      </ul>
      ${totalLine}
    </article>`;
  }).join("");

  const sessionHTML = sessions.length ? (() => {
    const mins = sessions.reduce((s, x) => s + totalTime(x.r), 0);
    return `<div class="panel p-5 sm:p-6 mb-6">
      <h2 class="text-2xl font-extrabold mb-1">Session de cuisine</h2>
      <p class="muted mb-3">${sessions.length} ${plur(sessions.length, "plat à cuisiner", "plats à cuisiner")} en une fois, environ ${mins} min de préparation et cuisson cumulées. Les restes se réchauffent les jours suivants.</p>
      <ul class="list-none p-0 m-0 grid gap-2">${sessions.map(x => `<li class="flex flex-wrap items-baseline justify-between gap-2"><span class="font-semibold">${esc(x.r.name)}</span><span class="muted text-sm">${x.n} repas, ${FR.format(x.n * P)} portions, ${totalTime(x.r)} min, se garde ${x.r.keep} jours</span></li>`).join("")}</ul>
    </div>`;
  })() : "";

  $("#view").innerHTML = `
    <div class="fade-in">
      <div class="flex flex-wrap items-end justify-between gap-4 mb-6">
        <div>
          <h1 id="plan-title" tabindex="-1" class="text-4xl sm:text-5xl font-extrabold">Votre semaine à table</h1>
          <p class="muted mt-2">${days.length} ${plur(days.length, "jour", "jours")}, ${plan.slots.length} ${plur(plan.slots.length, "repas", "repas")}, ${FR.format(P)} ${plur(P, "portion", "portions")} par repas${nLocks ? `, ${nLocks} ${plur(nLocks, "recette verrouillée", "recettes verrouillées")}` : ""}</p>
        </div>
        <div class="flex flex-wrap gap-2 no-print">
          <button type="button" id="btn-shop" data-act="shop" class="btn btn-primary">Voir la liste de courses</button>
          <button type="button" id="btn-regen" data-act="regen" class="btn btn-soft">Régénérer</button>
          <button type="button" id="btn-edit" data-act="edit" class="btn btn-line">Modifier mes choix</button>
          <button type="button" data-act="print" class="btn btn-line">Imprimer</button>
        </div>
      </div>

      <section class="panel p-5 sm:p-6 mb-6" aria-label="Résumé du budget et de la nutrition">
        <div class="grid gap-6 md:grid-cols-[1.4fr_1fr]">
          <div>
            <p class="muted text-sm">Coût estimé</p>
            <p class="flex items-baseline gap-2 flex-wrap"><span class="display text-4xl font-extrabold" data-count="${cost}" style="${over ? "color:var(--err-ink)" : ""}">${eur(cost)}</span><span class="muted">sur un budget de ${eur(B)}</span></p>
            <div class="bar my-3" role="progressbar" aria-label="Coût estimé par rapport au budget" aria-valuemin="0" aria-valuemax="${B}" aria-valuenow="${Math.round(cost)}"><span data-p="${ratio}" style="transform:scaleX(${ratio});${over ? "background:var(--err-ink)" : ""}"></span></div>
            <p class="text-sm">${over ? `Dépassement de ${eur(cost - B)}.` : `Il reste ${eur(B - cost)} de marge.`} Soit ${eur(Math.round(perMeal * 100) / 100)} par repas complet et par portion <span class="badge accent ml-1">${lvl.label}</span></p>
          </div>
          <dl class="grid grid-cols-2 gap-3 content-start">
            <div class="fact"><b>${FRI.format(f1[0])} ${f1[1]}</b><span>${f1[2]}</span></div>
            <div class="fact"><b>${FRI.format(f2[0])} ${f2[1]}</b><span>${f2[2]}</span></div>
          </dl>
        </div>
        ${!nLocks && filled.length ? '<p class="muted text-sm mt-4 no-print">Astuce : verrouillez les recettes que vous aimez, puis régénérez pour ne changer que le reste.</p>' : ""}
      </section>

      ${alerts.length ? `<div class="grid gap-3 mb-6">${alerts.join("")}</div>` : ""}
      ${sessionHTML}
      <div class="grid gap-4 md:grid-cols-2 xl:grid-cols-3">${cards}</div>
    </div>`;
  if (focusSel) { const el = $(focusSel); if (el) el.focus(); }
  motion("plan", opts);
}
/* mise à jour sans rejouer les animations d'entrée */
function refreshPlan(focusSel) {
  const y = window.scrollY;
  persist();
  renderPlan(focusSel, { static: true });
  window.scrollTo(0, y);
  renderNav();
}

function regenerate() {
  const pc = state.plan.cfg;
  const p = buildPlan(pc, Math.random, state.plan, state.favs);
  state.plan = { id: uid(), ts: Date.now(), cfg: clone(pc), ...p };
  state.checked = new Set();
  persist();
  renderPlan("#plan-title");
  const nl = state.plan.slots.filter(s => s.locked).length;
  toast(nl ? `Nouveau planning généré, ${nl} ${plur(nl, "recette conservée", "recettes conservées")}` : "Nouveau planning généré");
}
function replaceSlot(idx) {
  const sl = state.plan.slots[idx];
  if (sl.locked) { toast("Cette recette est verrouillée"); return; }
  const res = pickReplacement(state.plan, idx, state.plan.cfg, Math.random, state.favs);
  if (!res.id) {
    toast(res.reason === "budget" ? "Aucune alternative dans votre budget" : "Aucune autre recette compatible avec vos filtres");
    return;
  }
  sl.rid = res.id;
  persist();
  renderPlan(`[data-act="replace"][data-i="${idx}"]`, { slot: idx });
  renderNav();
  toast("Remplacé par « " + recipeById(res.id).name + " »");
}
function toggleLock(idx) {
  const sl = state.plan.slots[idx];
  if (!sl.rid) return;
  sl.locked = !sl.locked;
  refreshPlan(`[data-act="lock"][data-i="${idx}"]`);
  toast(sl.locked ? "Recette verrouillée : elle sera conservée à la régénération" : "Recette déverrouillée");
}
function toggleFav(id) {
  if (!R(id)) return;
  const on = !state.favs.has(id);
  on ? state.favs.add(id) : state.favs.delete(id);
  persist();
  renderNav();
  if (state.view === "plan") refreshPlan(`[data-act="fav"][data-id="${id}"]`);
  else if (state.view === "favs") renderFavs(`[data-act="fav"][data-id="${id}"]`);
  else if (state.view === "mine") renderMine();
  const t = $("#modal-root [data-act='fav']"); if (t && t.dataset.id === id) { t.setAttribute("aria-pressed", String(on)); t.innerHTML = STAR(on) + "<span>" + (on ? "Favori" : "Ajouter aux favoris") + "</span>"; }
  toast(on ? "Ajouté aux favoris" : "Retiré des favoris");
}

function doMove(i, j) {

  [a.rid, b.rid] = [b.rid, a.rid];

  closeModal();
  refreshPlan(`[data-act="move"][data-i="${j}"]`);
  toast("Recettes échangées");
}

/* ============================================================
   MINUTEURS
   ============================================================ */
const timers = [];
let timerSeq = 0, timerInt = null, actx = null;
function ensureAudio() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = actx || new AC();
    if (actx.state === "suspended") actx.resume();
  } catch (e) { /* audio indisponible */ }
}
function beep() {
  try {
    ensureAudio();
    if (!actx) return;
    [0, 0.35, 0.7].forEach(dt => {
      const o = actx.createOscillator(), g = actx.createGain(), t0 = actx.currentTime + dt;
      o.type = "sine"; o.frequency.value = 880; g.gain.value = 0.18;
      o.connect(g); g.connect(actx.destination);
      o.start(t0); o.stop(t0 + 0.22);
    });
  } catch (e) { /* ignoré */ }
}
const leftSec = t => Math.max(0, Math.ceil((t.end - Date.now()) / 1000));
function renderTimers() {
  const tray = $("#timers");
  if (!tray) return;
  if (!timers.length) { tray.innerHTML = ""; tray.hidden = true; return; }
  tray.hidden = false;
  tray.innerHTML = `<ul class="list-none p-0 m-0 grid gap-2">${timers.map(t => `
    <li class="timer ${t.done ? "is-done" : ""}">
      <div class="min-w-0"><p class="text-xs muted truncate">${esc(t.label)}</p>
        <p class="timer-clock" data-clock="${t.id}">${t.done ? "Terminé" : fmtClock(leftSec(t))}</p></div>
      <button type="button" class="btn btn-sm ${t.done ? "btn-primary" : "btn-line"}" data-act="timer-stop" data-id="${t.id}">${t.done ? "OK" : "Annuler"}</button>
    </li>`).join("")}</ul>`;
}
function tickTimers() {
  let changed = false;
  timers.forEach(t => {
    if (t.done) return;
    const left = leftSec(t), el = $(`[data-clock="${t.id}"]`);
    if (el) el.textContent = fmtClock(left);
    if (left <= 0) { t.done = true; changed = true; beep(); try { navigator.vibrate && navigator.vibrate([300, 150, 300, 150, 300]); } catch (e) { /* ignoré */ } toast("Minuteur terminé : " + t.label); }
  });
  if (changed) renderTimers();
  if (!timers.some(t => !t.done)) { clearInterval(timerInt); timerInt = null; }
}
function startTimer(sec, label) {
  if (!Number.isFinite(sec) || sec <= 0 || sec > 6 * 3600) return;
  if (timers.length >= 8) { toast("8 minuteurs maximum"); return; }
  ensureAudio();
  timers.push({ id: ++timerSeq, label: String(label).slice(0, 80), sec, end: Date.now() + sec * 1000, done: false });
  renderTimers();
  if (!timerInt) timerInt = setInterval(tickTimers, 500);
  toast("Minuteur lancé : " + fmtDuration(sec));
}
function stopTimer(id) {
  const k = timers.findIndex(t => t.id === id);
  if (k >= 0) timers.splice(k, 1);
  renderTimers();
}

const cook = { open: false, rid: null, mult: 1, step: 0, ing: false, wake: "idle", opener: null };
let wakeLock = null;
async function wakeOn() {

    wakeLock = await navigator.wakeLock.request("screen");
    cook.wake = "on";
    wakeLock.addEventListener("release", () => { wakeLock = null; if (cook.open) cook.wake = "off"; });
  } catch (e) { cook.wake = "off"; }
  if (cook.open) updateWakeNote();
}
function wakeOff() { try { wakeLock && wakeLock.release(); } catch (e) { /* ignoré */ } wakeLock = null; }
function wakeText() {
  return cook.wake === "on" ? "Écran maintenu allumé." : cook.wake === "unsupported" ? "Votre navigateur ne peut pas garder l'écran allumé : réglez la mise en veille de l'appareil." : cook.wake === "off" ? "Écran maintenu allumé indisponible pour le moment." : "";
}
function updateWakeNote() { const el = $("#cook-wake"); if (el) el.textContent = wakeText(); }
document.addEventListener("visibilitychange", () => { if (!document.hidden && cook.open && !wakeLock) wakeOn(); });

function openCook(rid, mult, opener) {

        ${tm.length ? `<div class="cook-timers">${tm.map(t => `<button type="button" class="btn btn-soft" data-act="timer-start" data-sec="${t.sec}" data-label="${esc(r.name)}, étape ${cook.step + 1}">Lancer un minuteur de ${esc(t.label)}</button>`).join("")}</div>` : ""}
      </div>

  cook.step = k;

function openEditor(id, opener) {

function saveEditor() {
  const errs = [], g = id => $("#" + id).value;
  const name = g("ed-name").trim();
  if (!name) errs.push("Le nom est obligatoire.");
  const num = (id, label, lo, hi) => { const n = Number(g(id)); if (g(id) === "" || !Number.isFinite(n) || n < lo || n > hi) { errs.push(`${label} : entrez un nombre entre ${lo} et ${hi}.`); return lo; } return n; };
  const prepTime = num("ed-prep", "Préparation", 0, 600), cookTime = num("ed-cook", "Cuisson", 0, 600);
  const costPerPerson = num("ed-cost", "Coût par portion", 0, 50), calories = num("ed-kcal", "Calories", 0, 3000);
  const protein = num("ed-prot", "Protéines", 0, 300), keep = num("ed-keep", "Conservation", 0, 5);
  const ingredients = [];
  g("ed-ing").split("\n").forEach((line, k) => {
    if (!line.trim()) return;
    const p = parseIngredientLine(line);
    if (!p || p.baseQty > 5000) errs.push(`Ingrédient, ligne ${k + 1} : « ${line.trim().slice(0, 40)} » n'est pas reconnu. Format : quantité, unité facultative, nom.`);
    else ingredients.push(p);
  });
  if (!ingredients.length && !errs.some(e => e.startsWith("Ingrédient"))) errs.push("Ajoutez au moins un ingrédient.");
  const instructions = g("ed-steps").split("\n").map(s => s.trim()).filter(Boolean);
  if (!instructions.length) errs.push("Ajoutez au moins une étape.");
  if (errs.length) {
    const box = $("#ed-err");
    box.hidden = false;
    box.innerHTML = "<strong>À corriger :</strong><ul class=\"m-0 pl-5\">" + errs.map(e => `<li>${esc(e)}</li>`).join("") + "</ul>";
    box.scrollIntoView({ block: "nearest" });
    return;
  }
  const obj = {
    id: state.editing || "u" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5).padEnd(3, "0"),
    name, kind: g("ed-kind"), category: g("ed-cat"), prepTime, cookTime, costPerPerson, calories, protein, keep,
    diet: $$("[data-ed-diet]:checked").map(i => i.dataset.edDiet), equipments: $$("[data-ed-equip]:checked").map(i => i.dataset.edEquip),

  if (!clean) { const box = $("#ed-err"); box.hidden = false; box.textContent = "Recette invalide : vérifiez les champs."; return; }
  const at = RECIPES.findIndex(r => r.id === clean.id);
  if (at >= 0) RECIPES[at] = clean; else RECIPES.push(clean);
  reindex();

}

<script>
/* ============================================================
   MOTION : GSAP + ScrollTrigger + Lenis
   Amélioration progressive : si les libs ou ce script échouent,
   .has-motion est retiré et le site reste lisible tel quel.
   ============================================================ */
(() => {
  const root = document.documentElement;
  const view = document.getElementById("view");
  const topbar = document.querySelector(".topbar");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)");
  const desktop = matchMedia("(min-width: 768px)");

  /* ----- Réglages ----- */
  const CONFIG = {
    desktop: { dur: 0.8, ease: "power3.out", stagger: 0.07, y: 32, parallax: 8 },
    mobile:  { dur: 0.6, ease: "power3.out", stagger: 0.04, y: 16, parallax: 0 }   // < 768 px
  };
  const MAGNET = 0.25;   // force de l'effet magnétique sur les CTA (0 = désactivé)
  const cfg = () => (desktop.matches ? CONFIG.desktop : CONFIG.mobile);

  let lenis, ctx, tick, ready = false, prevScale = null;

  /* ----- Helpers d'animation : états initiaux posés ici, nettoyés à la fin ----- */
  const cap = n => Math.min(cfg().stagger, 0.6 / Math.max(1, n - 1));   // étalement total plafonné à 0,6 s

  function hide(targets, y = cfg().y) {
    const els = gsap.utils.toArray(targets);
    gsap.set(els, { opacity: 0, y, willChange: "transform, opacity" });
    return els;
  }
  function show(els, vars = {}) {
    const c = cfg();
    return gsap.to(els, {
      opacity: 1, y: 0, duration: c.dur, ease: c.ease, stagger: cap(els.length),
      clearProps: "opacity,transform,willChange",   // will-change retiré après l'animation
      ...vars
    });
  }
  const reveal = (targets, vars, y) => show(hide(targets, y), vars);

  /* Découpe maison d'un titre en mots (masque + translation). aria-label conserve la lecture d'écran. */
  function splitWords(el) {
    const words = el.textContent.trim().split(/\s+/);
    el.setAttribute("aria-label", words.join(" "));
    el.textContent = "";
    words.forEach((w, i) => {
      if (i) el.append(" ");
      const outer = document.createElement("span");
      const inner = document.createElement("span");
      outer.className = "mw"; outer.setAttribute("aria-hidden", "true");
      inner.className = "mw-i"; inner.textContent = w;
      outer.append(inner); el.append(outer);
    });

  }
  function revealTitle(el, delay = 0) {
    const words = splitWords(el);
    gsap.set(words, { yPercent: 110 });
    gsap.to(words, { yPercent: 0, duration: cfg().dur, ease: cfg().ease, stagger: 0.06, delay, clearProps: "transform" });
  }

  /* ----- Formulaire (étapes) ----- */
  function wizard({ intro }) {
    const c = cfg(), d = intro ? 0.2 : 0;

    // barre de progression : de l'étape précédente vers l'étape courante
    const bar = view.querySelector(".bar > span");
    const target = parseFloat(bar.dataset.p);

    prevScale = target;

    if (intro) reveal(view.querySelector(".panel"), { delay: d }, 16);
    revealTitle(view.querySelector("#step-title"), d);
    reveal(view.querySelectorAll(".steps li"), { delay: d + 0.1 }, 10);
    reveal(view.querySelector("#step-title + p"), { delay: d + 0.2 });

    // enfants du corps de l'étape (on descend d'un niveau dans les grilles/listes)
    const kids = [];
    view.querySelectorAll("#step-body > *").forEach(el => kids.push(...(el.matches("ul, .grid") ? el.children : [el])));
    reveal(kids, { delay: d + 0.25 });
  }

  /* ----- Planning ----- */
  function plan({ slot }) {
    const c = cfg();
    parallax(c);

    // remplacement d'une recette : on n'anime que le créneau concerné
    if (slot != null) {
      const li = view.querySelector(`[data-replace="${slot}"]`)?.closest(".slot");
      reveal(li, {}, c.y / 2);
      return;
    }

    revealTitle(view.querySelector("#plan-title"));
    reveal(view.querySelectorAll("#plan-title + p, .no-print"), { delay: 0.15 });
    signature(view.querySelector("section.panel"), 0.3);
    reveal(view.querySelectorAll(".alert"), { delay: 0.45 });

    // cartes de jours : état caché posé maintenant, révélées à l'entrée dans le viewport
    const cards = hide(view.querySelectorAll(".day-card"));
    hide(view.querySelectorAll(".day-card .slot"), c.y / 2);
    ScrollTrigger.batch(cards, {
      start: "top 92%", once: true,
      onEnter: batch => {
        show(batch, { stagger: c.stagger * 2 });
        batch.forEach(card => show(card.querySelectorAll(".slot"), { delay: 0.15 }));
      }
    });
  }

  /* Animation signature : le résumé budget se « remplit » (jauge + compteur + faits) */
  function signature(panel, delay) {
    const c = cfg(), dur = c.dur + 0.2;
    reveal(panel, { delay }, c.y / 2);

    const bar = panel.querySelector(".bar > span");
    gsap.fromTo(bar, { scaleX: 0 }, { scaleX: parseFloat(bar.dataset.p), duration: dur, ease: c.ease, delay: delay + 0.25 });
    reveal(panel.querySelectorAll(".fact"), { delay: delay + 0.4 }, 12);

    const num = panel.querySelector("[data-count]");
    const to = parseFloat(num.dataset.count) || 0;
    const fmt = typeof eur === "function" ? eur : v => v.toFixed(2);   // eur() vient du script applicatif
    num.style.minWidth = num.getBoundingClientRect().width + "px";      // largeur réservée : pas de décalage
    num.textContent = fmt(0);
    const o = { v: 0 };
    gsap.to(o, {
      v: to, duration: dur, ease: c.ease, delay: delay + 0.25,
      onUpdate: () => { num.textContent = fmt(o.v); },
      onComplete: () => { num.textContent = fmt(to); num.style.minWidth = ""; }
    });
  }

  /* Parallaxe discrète des pictos de recette (desktop uniquement) */
  function parallax(c) {
    if (!c.parallax) return;
    view.querySelectorAll(".day-card").forEach(card => {
      const icons = card.querySelectorAll(".slot-icon");
      gsap.fromTo(icons, { y: -c.parallax }, {
        y: c.parallax, ease: "none",
        scrollTrigger: {
          trigger: card, start: "top bottom", end: "bottom top", scrub: true,
          onToggle: st => icons.forEach(i => { i.style.willChange = st.isActive ? "transform" : ""; })
        }
      });
    });
  }

  /* ----- Point d'entrée appelé après chaque rendu de l'application ----- */
  function after(type, opts = {}) {
    if (!ready || !root.classList.contains("has-motion")) return;
    try {
      ctx && ctx.revert();
      ctx = null;
      if (type === "none" || opts.static) { ScrollTrigger.refresh(); return; }   // pas d'animation d'entrée (mise à jour sur place)
      ctx = gsap.context(() => (type === "wizard" ? wizard(opts) : plan(opts)), view);
      ScrollTrigger.refresh();
    } catch (err) { console.error("[motion]", err); disable(); }
  }

  /* ----- Lenis + synchronisation ScrollTrigger ----- */
  function setupLenis() {
    lenis = new Lenis({ lerp: 0.1 });
    lenis.on("scroll", ScrollTrigger.update);
    tick = t => lenis.raf(t * 1000);
    gsap.ticker.add(tick);
    gsap.ticker.lagSmoothing(0);
  }

  /* Navbar : état « scrollé » + masquage vers le bas / réapparition vers le haut */
  function setupNavbar() {
    const measure = () => root.style.setProperty("--topbar-h", topbar.offsetHeight + "px");
    measure();
    addEventListener("resize", measure);
    let last = 0;
    lenis.on("scroll", ({ scroll }) => {
      topbar.classList.toggle("is-scrolled", scroll > 16);
      const delta = scroll - last;
      if (Math.abs(delta) < 6) return;   // seuil anti-jitter
      last = scroll;
      topbar.classList.toggle("is-hidden", delta > 0 && scroll > topbar.offsetHeight * 2 && !document.querySelector(".dialog"));
    });
    topbar.addEventListener("focusin", () => topbar.classList.remove("is-hidden"));   // navigation clavier
  }

  /* Ancres #section : Lenis ne les gère pas seul avec un en-tête sticky */
  function setupAnchors() {
    document.addEventListener("click", e => {
      const a = e.target.closest && e.target.closest('a[href^="#"]');
      if (!a || a.getAttribute("href").length < 2 || e.defaultPrevented || !lenis) return;
      let id;
      try { id = decodeURIComponent(a.hash.slice(1)); } catch (err) { return; }
      const target = document.getElementById(id);
      if (!target) return;
      e.preventDefault();
      lenis.scrollTo(target, { offset: -topbar.offsetHeight, onComplete: () => target.focus({ preventScroll: true }) });
      history.pushState(null, "", a.hash);
    });
  }

  /* Effet magnétique léger sur les CTA principaux (souris uniquement) */
  function setupMagnet() {
    if (!MAGNET || !matchMedia("(hover: hover) and (pointer: fine)").matches) return;
    const SEL = "#next, #btn-shop", cache = new WeakMap();
    const quick = el => {
      if (!cache.has(el)) cache.set(el, {
        x: gsap.quickTo(el, "x", { duration: 0.5, ease: "power3.out" }),
        y: gsap.quickTo(el, "y", { duration: 0.5, ease: "power3.out" })
      });
      return cache.get(el);
    };
    document.addEventListener("pointermove", e => {
      if (e.pointerType !== "mouse") return;
      const b = e.target.closest && e.target.closest(SEL);
      if (!b || b.disabled) return;
      const r = b.getBoundingClientRect(), q = quick(b);
      q.x((e.clientX - r.left - r.width / 2) * MAGNET);
      q.y((e.clientY - r.top - r.height / 2) * MAGNET);
    });
    document.addEventListener("pointerout", e => {
      const b = e.target.closest && e.target.closest(SEL);
      if (!b || b.contains(e.relatedTarget)) return;
      const q = cache.get(b);
      if (q) { q.x(0); q.y(0); }
    });
  }

  /* ----- Désactivation propre (erreur, ou préférence reduced-motion activée en cours de route) ----- */
  function disable() {
    ready = false;
    if (window.gsap) {
      try { ctx && ctx.revert(); } catch (err) { /* déjà détruit */ }
      if (tick) gsap.ticker.remove(tick);
      gsap.set(view.querySelectorAll("*"), { clearProps: "opacity,willChange" });
      gsap.set(view.querySelectorAll(".mw-i"), { clearProps: "transform" });
    }
    if (lenis) { lenis.destroy(); lenis = null; }
    root.classList.remove("has-motion");
    topbar.classList.remove("is-hidden", "is-scrolled");
  }

  function init() {
    if (!root.classList.contains("has-motion")) return;   // reduced-motion ou filet de sécurité déclenché
    if (!(window.gsap && window.ScrollTrigger && window.Lenis)) { root.classList.remove("has-motion"); return; }
    try {
      gsap.registerPlugin(ScrollTrigger);
      setupLenis(); setupNavbar(); setupAnchors(); setupMagnet();
      ready = true;

      // intro : l'en-tête puis le premier écran
      const head = topbar.querySelector(".shell");
      gsap.set(head, { opacity: 0, y: -10 });
      root.classList.add("motion-ready");
      gsap.to(head, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out", clearProps: "opacity,transform" });
      after(view.querySelector("#step-title") ? "wizard" : view.querySelector("#plan-title") ? "plan" : "none", { intro: true });

      if (document.fonts) document.fonts.ready.then(() => ready && ScrollTrigger.refresh());   // les polices modifient la hauteur
      reduce.addEventListener("change", e => { if (e.matches) disable(); });
    } catch (err) { console.error("[motion]", err); disable(); }
  }

  window.Motion = {
    after,
    lock: on => { if (lenis) on ? lenis.stop() : lenis.start(); },
    toTop: smooth => lenis
      ? lenis.scrollTo(0, { immediate: !smooth })
      : scrollTo({ top: 0, behavior: smooth && !reduce.matches ? "smooth" : "auto" })
  };

  // les scripts defer (libs) sont exécutés avant DOMContentLoaded
  document.addEventListener("DOMContentLoaded", init);
})();
</script>
</body>
</html>
