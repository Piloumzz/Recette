<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Semainier : planificateur de repas</title>
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          display: ['"Bricolage Grotesque"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          sans: ['Figtree', 'ui-sans-serif', 'system-ui', 'sans-serif']
        }
      }
    }
  };
</script>
<style>
  :root {
    --bg: #EEE7D8; --surface: #F8F3E7; --surface-2: #E6DEC9; --ink: #26323A; --muted: #55606A; --line: #D3CAB3;
    --accent: #4F5D26; --accent-ink: #F8F3E7; --accent-text: #4F5D26;
    --sage: #D8DDBF; --sage-ink: #34411A;
    --warn-bg: #F1DFB4; --warn-ink: #5E3F0C; --err-bg: #EFD3CE; --err-ink: #74271F;
    --focus: #2A5E92; --overlay: rgba(24, 31, 36, .55);
    --eco: #7B8F3C; --equi: #4F5D26; --conf: #2E3A42;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161D22; --surface: #1F282E; --surface-2: #2A353D; --ink: #EDE6D6; --muted: #A8B0B2; --line: #36434C;
      --accent: #B4C373; --accent-ink: #171E12; --accent-text: #C2D083;
      --sage: #2F3A24; --sage-ink: #D5E0A8;
      --warn-bg: #3D3115; --warn-ink: #F0D58C; --err-bg: #43211E; --err-ink: #F3B8B0;
      --focus: #8DB8E8; --overlay: rgba(0, 0, 0, .65);
      --eco: #A3B563; --equi: #B4C373; --conf: #8FA3B0;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161D22; --surface: #1F282E; --surface-2: #2A353D; --ink: #EDE6D6; --muted: #A8B0B2; --line: #36434C;
    --accent: #B4C373; --accent-ink: #171E12; --accent-text: #C2D083;
    --sage: #2F3A24; --sage-ink: #D5E0A8;
    --warn-bg: #3D3115; --warn-ink: #F0D58C; --err-bg: #43211E; --err-ink: #F3B8B0;
    --focus: #8DB8E8; --overlay: rgba(0, 0, 0, .65);
    --eco: #A3B563; --equi: #B4C373; --conf: #8FA3B0;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { background: var(--bg); }
  body { color: var(--ink); font-family: Figtree, ui-sans-serif, system-ui, sans-serif; font-size: 16px; line-height: 1.5; min-height: 100vh; margin: 0; }
  h1, h2, h3, .display { font-family: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif; letter-spacing: -0.02em; line-height: 1.1; }
  .muted { color: var(--muted); }
  .skip { position: absolute; left: -999px; top: 0; background: var(--accent); color: var(--accent-ink); padding: .5rem 1rem; border-radius: 8px; z-index: 100; }
  .skip:focus { left: 1rem; top: 1rem; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  button, input, label { -webkit-tap-highlight-color: transparent; }
  button { cursor: pointer; font: inherit; color: inherit; }

  /* ----- boutons ----- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; min-height: 44px; padding: .55rem 1.1rem; border-radius: 12px; font-weight: 600; border: 1.5px solid transparent; transition: background-color .15s, border-color .15s, transform .1s; }
  .btn:active { transform: scale(.98); }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-primary:disabled { opacity: .45; cursor: not-allowed; filter: none; }
  .btn-soft { background: var(--sage); color: var(--sage-ink); }
  .btn-soft:hover { filter: brightness(.96); }
  .btn-line { background: transparent; border-color: var(--line); }
  .btn-line:hover { border-color: var(--accent-text); }
  .btn-sm { min-height: 38px; padding: .35rem .8rem; font-size: .9rem; border-radius: 10px; }

  /* ----- mise en page ----- */
  .shell { width: 100%; max-width: 1120px; margin: 0 auto; padding: 0 1.1rem; }
  .topbar { border-bottom: 1px solid var(--line); }
  .brand { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 1.35rem; letter-spacing: -0.03em; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; }
  .fade-in { animation: fadeIn .2s ease-out; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* ----- progression ----- */
  .bar { height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s ease; }
  .steps { display: none; }
  @media (min-width: 768px) { .steps { display: flex; } }
  .step-btn { display: flex; align-items: center; gap: .5rem; padding: .3rem .1rem; background: none; border: 0; color: var(--muted); font-size: .9rem; font-weight: 500; text-align: left; }
  .step-btn .n { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: .8rem; font-weight: 700; background: var(--surface-2); color: var(--muted); flex: none; }
  .step-btn.is-done .n { background: var(--sage); color: var(--sage-ink); }
  .step-btn.is-current { color: var(--ink); font-weight: 700; }
  .step-btn.is-current .n { background: var(--accent); color: var(--accent-ink); }

  /* ----- options (cases, radios) ----- */
  .vh { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); border: 0; white-space: nowrap; }
  .opt-card { position: relative; display: block; cursor: pointer; }
  .opt-card .body { display: flex; align-items: flex-start; gap: .75rem; padding: .9rem 1rem; border: 1.5px solid var(--line); border-radius: 14px; background: var(--surface); transition: border-color .15s, background-color .15s; height: 100%; }
  .opt-card:hover .body { border-color: var(--accent-text); }
  .opt-card input:checked + .body { border-color: var(--accent); background: var(--sage); }
  .opt-card input:focus-visible + .body { outline: 3px solid var(--focus); outline-offset: 2px; }
  .tick { flex: none; width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--muted); display: grid; place-items: center; margin-top: 2px; color: transparent; transition: background-color .15s, border-color .15s; }
  .opt-card input:checked + .body .tick { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .opt-card input[type="radio"] + .body .tick { border-radius: 50%; }
  .opt-title { font-weight: 600; display: block; }
  .opt-desc { font-size: .88rem; color: var(--muted); display: block; margin-top: 2px; }
  .opt-card input:checked + .body .opt-desc { color: var(--sage-ink); }
  .ico { font-size: 1.4rem; line-height: 1; flex: none; margin-top: 1px; }

  .dayrow { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .6rem; padding: .6rem .8rem; border: 1.5px solid var(--line); border-radius: 14px; background: var(--surface); transition: border-color .15s, background-color .15s; }
  .dayrow.is-on { border-color: var(--accent); background: var(--sage); }
  .dayrow label.chk { display: flex; align-items: center; gap: .7rem; cursor: pointer; min-height: 40px; flex: 1 1 150px; font-weight: 600; }
  .dayrow input:checked + .tick { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .dayrow input:focus-visible + .tick { outline: 3px solid var(--focus); outline-offset: 2px; }
  .seg { display: none; border-radius: 12px; background: var(--surface); border: 1.5px solid var(--line); padding: 3px; gap: 2px; }
  .dayrow.is-on .seg { display: inline-flex; }
  .seg label { cursor: pointer; }
  .seg span { display: block; padding: .35rem .75rem; border-radius: 9px; font-size: .88rem; font-weight: 600; color: var(--muted); min-height: 34px; line-height: 1.6; }
  .seg input:checked + span { background: var(--accent); color: var(--accent-ink); }
  .seg input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 1px; }

  /* ----- nombre de personnes ----- */
  .round { width: 56px; height: 56px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); font-size: 1.7rem; line-height: 1; display: grid; place-items: center; transition: border-color .15s, background-color .15s; }
  .round:hover:not(:disabled) { border-color: var(--accent-text); background: var(--sage); }
  .round:disabled { opacity: .35; cursor: not-allowed; }
  .num-input { width: 6rem; text-align: center; font-family: "Bricolage Grotesque", sans-serif; font-size: 3.4rem; font-weight: 800; background: transparent; border: 0; border-bottom: 3px solid var(--accent); color: var(--ink); padding: 0; -moz-appearance: textfield; }
  .num-input::-webkit-outer-spin-button, .num-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  /* ----- budget ----- */
  input[type="range"] { width: 100%; accent-color: var(--accent); height: 32px; cursor: pointer; }
  .field { background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: .5rem .7rem; color: var(--ink); font-weight: 600; min-height: 44px; }
  .gauge { position: relative; display: flex; height: 12px; border-radius: 99px; overflow: hidden; gap: 2px; }
  .gauge i { display: block; height: 100%; }
  .gauge .g1 { width: 30%; background: var(--eco); } .gauge .g2 { width: 30%; background: var(--equi); opacity: .75; } .gauge .g3 { width: 40%; background: var(--conf); }
  .marker { position: absolute; top: -6px; width: 4px; height: 24px; background: var(--ink); border-radius: 2px; transform: translateX(-50%); transition: left .2s ease; }
  .badge { display: inline-flex; align-items: center; padding: .15rem .6rem; border-radius: 99px; font-size: .82rem; font-weight: 600; background: var(--surface-2); color: var(--ink); white-space: nowrap; }
  .badge.accent { background: var(--sage); color: var(--sage-ink); }
  .level { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 1.6rem; letter-spacing: -0.02em; }

  /* ----- alertes ----- */
  .alert { border-radius: 14px; padding: .8rem 1rem; font-size: .95rem; }
  .alert.warn { background: var(--warn-bg); color: var(--warn-ink); }
  .alert.err { background: var(--err-bg); color: var(--err-ink); }
  .alert.info { background: var(--sage); color: var(--sage-ink); }
  .alert strong { font-weight: 700; }

  /* ----- navigation du formulaire ----- */
  .nav { position: sticky; bottom: 0; background: linear-gradient(to top, var(--bg) 70%, transparent); padding: 1rem 0 .75rem; }

  /* ----- planning ----- */
  .day-card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 1.1rem 1.1rem 1rem; display: flex; flex-direction: column; gap: .9rem; }
  .day-name { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 1.7rem; letter-spacing: -0.03em; padding-left: .7rem; border-left: 5px solid var(--accent); }
  .slot { border-radius: 14px; border: 1px solid var(--line); background: var(--bg); overflow: hidden; }
  .slot-open { display: flex; gap: .8rem; width: 100%; text-align: left; padding: .8rem; background: none; border: 0; transition: background-color .15s; }
  .slot-open:hover { background: var(--sage); }
  .slot-icon { flex: none; width: 52px; height: 52px; border-radius: 14px; background: var(--sage); display: grid; place-items: center; font-size: 1.7rem; }
  .slot-name { font-weight: 700; font-size: 1.02rem; line-height: 1.25; }
  .meta { display: flex; flex-wrap: wrap; gap: .25rem .75rem; font-size: .85rem; color: var(--muted); margin-top: .35rem; }
  .meta b { color: var(--ink); font-weight: 600; }
  .slot-foot { display: flex; align-items: center; justify-content: space-between; gap: .5rem; padding: .45rem .8rem; border-top: 1px dashed var(--line); }
  .link-btn { background: none; border: 0; color: var(--accent-text); font-weight: 600; font-size: .9rem; padding: .35rem .2rem; min-height: 36px; border-radius: 8px; }
  .link-btn:hover { text-decoration: underline; }
  .slot-empty { padding: 1rem; font-size: .92rem; color: var(--muted); }

  /* ----- modales ----- */
  .overlay { position: fixed; inset: 0; z-index: 50; background: var(--overlay); display: flex; align-items: flex-end; justify-content: center; padding-top: env(safe-area-inset-top, 0px); animation: fadeIn .18s ease-out; }
  @media (min-width: 700px) { .overlay { align-items: center; padding: 1.5rem; } }
  .dialog { background: var(--surface); color: var(--ink); width: 100%; max-width: 680px; max-height: 92vh; overflow-y: auto; overscroll-behavior: contain; border-radius: 22px 22px 0 0; padding: 1.3rem 1.2rem calc(1.3rem + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -10px 40px rgba(0,0,0,.25); animation: sheetUp .22s ease-out; }
  @media (min-width: 700px) { .dialog { border-radius: 22px; padding: 1.8rem; max-height: 88vh; } }
  @keyframes sheetUp { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
  .x-btn { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); display: grid; place-items: center; }
  .x-btn:hover { background: var(--sage); }
  .facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .6rem; }
  @media (min-width: 560px) { .facts { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .fact { background: var(--bg); border-radius: 12px; padding: .6rem .8rem; }
  .fact b { display: block; font-family: "Bricolage Grotesque", sans-serif; font-size: 1.2rem; font-weight: 700; letter-spacing: -0.02em; }
  .fact span { font-size: .8rem; color: var(--muted); }
  .ing { display: grid; grid-template-columns: minmax(78px, auto) 1fr; gap: .35rem 1rem; }
  .ing dt { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
  .ing dd { margin: 0; }
  ol.steps-list { list-style: none; padding: 0; margin: 0; counter-reset: s; display: grid; gap: .9rem; }
  ol.steps-list li { counter-increment: s; display: grid; grid-template-columns: 30px 1fr; gap: .8rem; }
  ol.steps-list li::before { content: counter(s); width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-weight: 700; display: grid; place-items: center; font-size: .9rem; }

  .check { display: flex; align-items: center; gap: .75rem; cursor: pointer; min-height: 44px; padding: .15rem 0; }
  .check .tick { margin-top: 0; }
  .check input:checked + .tick { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .check input:focus-visible + .tick { outline: 3px solid var(--focus); outline-offset: 2px; }
  .check input:checked ~ .txt { color: var(--muted); text-decoration: line-through; }
  .check .qty { font-weight: 700; min-width: 4.2rem; font-variant-numeric: tabular-nums; }
  .aisle-title { font-size: 1.15rem; font-weight: 800; padding-bottom: .3rem; border-bottom: 2px solid var(--accent); display: flex; justify-content: space-between; align-items: baseline; }

  /* ----- toast ----- */
  #toast { position: fixed; left: 50%; bottom: calc(1rem + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--bg); padding: .65rem 1.1rem; border-radius: 12px; font-weight: 600; font-size: .92rem; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 80; max-width: calc(100vw - 2rem); text-align: center; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
  @media print { .topbar, .nav, #toast, .no-print { display: none !important; } }
</style>
</head>
<body>
<a class="skip" href="#main">Aller au contenu</a>
<header class="topbar">
  <div class="shell flex items-center justify-between py-3">
    <span class="brand">Semainier</span>
    <span class="muted text-sm hidden sm:inline">Planificateur de repas et liste de courses</span>
  </div>
</header>
<main id="main" class="shell py-6 sm:py-10">
  <div id="view"></div>
</main>
<div id="modal-root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
/* ============================================================
   BASE DE DONNÉES DES RECETTES
   Quantités (baseQty) calculées pour 1 personne.
   Tags diet : sans-porc, halal, sans-lactose, sans-gluten, vegetarien, vegan
   Équipements : base, four, airfryer, micro-ondes, mixeur, vapeur
   ============================================================ */
const T = { SP: "sans-porc", H: "halal", SL: "sans-lactose", SG: "sans-gluten", VG: "vegetarien", VN: "vegan" };
const i = (item, baseQty, unit = "g") => ({ item, baseQty, unit });

const RECIPES = [
  /* ---------- PROTÉINÉ / FITNESS ---------- */
  {
    id: "r01", name: "Poulet au paprika, riz basmati et brocolis", category: "proteine",
    diet: [T.SP, T.H, T.SL, T.SG], equipments: ["base"], prepTime: 10, cookTime: 20,
    costPerPerson: 3.4, calories: 520, protein: 47,
    ingredients: [i("Blanc de poulet", 150), i("Riz basmati", 70), i("Brocoli", 150), i("Huile d'olive", 10, "ml"), i("Paprika doux", 1, "càc"), i("Citron", 0.25, "pièce")],
    instructions: [
      "Couper le poulet en lanières de 2 cm. Les mélanger avec le paprika, la moitié de l'huile, du sel et du poivre, puis laisser mariner 10 minutes.",
      "Rincer le riz sous l'eau froide jusqu'à ce qu'elle soit claire. Le cuire dans deux fois son volume d'eau salée, à couvert, 10 à 12 minutes à feu doux, puis le laisser gonfler 5 minutes hors du feu.",
      "Détailler le brocoli en petits bouquets et les cuire 5 minutes à l'eau bouillante salée : ils doivent rester légèrement croquants. Égoutter.",
      "Faire chauffer le reste d'huile dans une poêle à feu vif et saisir le poulet 6 à 8 minutes en le retournant, jusqu'à ce qu'il soit doré et cuit à cœur (aucune partie rosée).",
      "Dresser le riz, les brocolis et le poulet, puis presser le citron par-dessus."
    ]
  },
  {
    id: "r02", name: "Bowl de bœuf haché, patate douce rôtie et haricots verts", category: "proteine",
    diet: [T.SP, T.H, T.SL, T.SG], equipments: ["base", "four"], prepTime: 10, cookTime: 30,
    costPerPerson: 3.6, calories: 610, protein: 41,
    ingredients: [i("Bœuf haché 5 % MG", 125), i("Patate douce", 200), i("Haricots verts", 120), i("Huile d'olive", 10, "ml"), i("Cumin moulu", 1, "càc"), i("Ail", 1, "gousse"), i("Citron", 0.25, "pièce")],
    instructions: [
      "Préchauffer le four à 200 °C (chaleur tournante).",
      "Éplucher la patate douce et la couper en dés de 2 cm. Les enrober avec la moitié de l'huile, la moitié du cumin, du sel et du poivre, puis les enfourner 25 à 30 minutes en les remuant à mi-cuisson.",
      "Cuire les haricots verts 8 minutes à l'eau bouillante salée. Égoutter et passer sous l'eau froide pour garder la couleur.",
      "Chauffer le reste d'huile dans une poêle à feu vif. Faire dorer le bœuf 5 à 6 minutes en l'émiettant, ajouter l'ail haché et le reste de cumin, puis cuire 1 minute de plus. Saler, poivrer.",
      "Assembler le tout dans un bol et finir par un filet de jus de citron."
    ]
  },
  {
    id: "r03", name: "Pavé de saumon au four, quinoa et courgettes", category: "proteine",
    diet: [T.SP, T.H, T.SL, T.SG], equipments: ["base", "four"], prepTime: 10, cookTime: 20,
    costPerPerson: 4.9, calories: 590, protein: 40,
    ingredients: [i("Pavé de saumon", 130), i("Quinoa", 60), i("Courgette", 150), i("Huile d'olive", 10, "ml"), i("Citron", 0.5, "pièce"), i("Persil plat", 5)],
    instructions: [
      "Préchauffer le four à 200 °C.",
      "Rincer le quinoa à l'eau froide. Le cuire 12 à 15 minutes dans deux fois son volume d'eau salée, jusqu'à ce que les petits germes se détachent. Égoutter si besoin et aérer à la fourchette.",
      "Couper les courgettes en rondelles, les disposer sur une plaque avec la moitié de l'huile, du sel et du poivre. Enfourner 5 minutes.",
      "Poser le saumon sur la plaque (sur du papier sulfurisé), arroser du reste d'huile, du jus d'un demi-citron, saler et poivrer. Poursuivre 12 à 15 minutes : la chair doit s'effeuiller facilement.",
      "Servir le saumon sur le quinoa, entouré des courgettes, avec le persil ciselé."
    ]
  },
  {
    id: "r04", name: "Cabillaud vapeur, riz parfumé et épinards", category: "proteine",
    diet: [T.SP, T.H, T.SL, T.SG], equipments: ["vapeur"], prepTime: 10, cookTime: 20,
    costPerPerson: 4.3, calories: 430, protein: 37,
    ingredients: [i("Dos de cabillaud", 140), i("Riz basmati", 65), i("Épinards frais", 100), i("Gingembre frais", 5), i("Citron", 0.5, "pièce"), i("Huile de sésame", 5, "ml")],
    instructions: [

/* ---------- utilitaires ---------- */
function shuffle(arr, rng = Math.random) {
  const a = arr.slice();
  for (let k = a.length - 1; k > 0; k--) {
    const j = Math.floor(rng() * (k + 1));
    [a[k], a[j]] = [a[j], a[k]];
  }
  return a;
}
const totalTime = r => r.prepTime + r.cookTime;
const recipeById = id => RECIPES.find(r => r.id === id);

/* ---------- filtres ---------- */
function eligible(r, cfg) {
  return cfg.diets.every(d => r.diet.includes(d)) && r.equipments.every(e => cfg.equip.includes(e));
}
function matchesStyle(r, s) {
  if (r.category === s) return true;
  if (s === "express") return totalTime(r) <= 20;
  if (s === "economique") return r.costPerPerson <= 2.3;
  if (s === "vegan") return r.diet.includes("vegan");
  if (s === "proteine") return r.protein >= 40;
  return false;
}
function prefersStyle(r, cfg) {
  return !cfg.styles.length || cfg.styles.some(s => matchesStyle(r, s));
}
function poolFor(cfg) { return RECIPES.filter(r => eligible(r, cfg)); }

function slotList(days) {
  const out = [];
  DAYS.forEach((_, d) => {
    const m = days[d];
    if (!m) return;
    if (m === "lunch" || m === "both") out.push({ day: d, meal: "lunch" });
    if (m === "dinner" || m === "both") out.push({ day: d, meal: "dinner" });
  });
  return out;
}

/* ---------- moteur de recommandation ---------- */
function buildPlan(cfg, rng = Math.random) {
  const slots = slotList(cfg.days);
  const N = slots.length, P = cfg.people, B = cfg.budget;
  const pool = poolFor(cfg);
  const unused = shuffle(pool, rng);
  const chosen = [];
  let spent = 0, styleFallback = 0, overBudget = false;

  for (let idx = 0; idx < N; idx++) {
    if (!unused.length) { chosen.push(null); continue; }
    const remainingAfter = Math.min(N - idx - 1, unused.length - 1);
    const feasible = r => {
      const reserve = unused.filter(x => x !== r).map(x => x.costPerPerson).sort((a, b) => a - b)
        .slice(0, remainingAfter).reduce((s, c) => s + c, 0) * P;
      return spent + r.costPerPerson * P + reserve <= B + 1e-9;
    };
    const target = (B - spent) / (N - idx);
    let cands = unused.filter(r => prefersStyle(r, cfg) && feasible(r));
    if (!cands.length) cands = unused.filter(feasible);
    let pick;
    if (!cands.length) {
      pick = unused.slice().sort((a, b) => a.costPerPerson - b.costPerPerson)[0];
      overBudget = true;
    } else {
      const balanced = cands.filter(r => r.costPerPerson * P <= target * 1.3);
      const src = balanced.length ? balanced : cands;
      pick = src[Math.floor(rng() * src.length)];
    }
    if (!prefersStyle(pick, cfg)) styleFallback++;
    spent += pick.costPerPerson * P;
    unused.splice(unused.indexOf(pick), 1);
    chosen.push(pick);
  }
  const filled = chosen.filter(Boolean).length;
  return {
    slots: slots.map((s, k) => ({ ...s, rid: chosen[k] ? chosen[k].id : null })),
    stats: { poolSize: pool.length, slotCount: N, filled, missing: N - filled, styleFallback, overBudget: overBudget || spent > B + 1e-9 }
  };
}

function planCost(plan, P) {
  return plan.slots.reduce((s, sl) => s + (sl.rid ? recipeById(sl.rid).costPerPerson * P : 0), 0);
}

/* Remplace la recette d'un créneau : renvoie le nouvel id ou null */
function pickReplacement(plan, idx, cfg, rng = Math.random) {
  const P = cfg.people, B = cfg.budget;
  const used = new Set(plan.slots.map(s => s.rid).filter(Boolean));
  const cur = plan.slots[idx].rid ? recipeById(plan.slots[idx].rid) : null;
  const base = planCost(plan, P) - (cur ? cur.costPerPerson * P : 0);
  const alts = poolFor(cfg).filter(r => !used.has(r.id));
  const fits = alts.filter(r => base + r.costPerPerson * P <= B + 1e-9);
  const preferred = fits.filter(r => prefersStyle(r, cfg));
  const src = preferred.length ? preferred : fits;
  if (!src.length) return { id: null, reason: alts.length ? "budget" : "pool" };
  return { id: src[Math.floor(rng() * src.length)].id, reason: null };
}

/* Aide quand le filtrage est trop strict */
function relaxHints(cfg, need) {
  const current = poolFor(cfg).length;
  const hints = [];
  cfg.diets.forEach(d => {
    const c2 = { ...cfg, diets: cfg.diets.filter(x => x !== d) };
    hints.push({ label: "retirer « " + DIET_LABEL[d] + " »", count: poolFor(c2).length });
  });
  EQUIP.filter(e => !cfg.equip.includes(e.id)).forEach(e => {
    const c2 = { ...cfg, equip: cfg.equip.concat(e.id) };
    hints.push({ label: "ajouter « " + e.label + " »", count: poolFor(c2).length });
  });
  return hints.filter(h => h.count > current).sort((a, b) => b.count - a.count).slice(0, 3);
}

/* ---------- quantités ---------- */
const FR = new Intl.NumberFormat("fr-FR", { maximumFractionDigits: 1 });
const FRC = new Intl.NumberFormat("fr-FR", { maximumFractionDigits: 2 });
function eur(n) {
  const whole = Math.abs(n - Math.round(n)) < 0.005;
  return new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR", minimumFractionDigits: whole ? 0 : 2, maximumFractionDigits: whole ? 0 : 2 }).format(n);
}
function fraction(q) {
  const r = Math.round(q * 4) / 4;
  const whole = Math.floor(r), f = r - whole;
  const sym = { 0.25: "¼", 0.5: "½", 0.75: "¾" }[f] || "";
  if (!whole && !sym) return "¼";
  return (whole ? String(whole) : "") + (whole && sym ? " " : "") + sym;
}
const UNIT_LABEL = { càc: "c. à café", càs: "c. à soupe", gousse: "gousse", tranche: "tranche" };

const PREP_STOP = new Set(["de", "du", "des", "à", "au", "aux", "en", "et", "sans", "avec"]);
function plural(name, q) {
  if (q <= 1) return name;
  let stop = false;
  return name.split(" ").map(w => {
    if (stop) return w;
    if (PREP_STOP.has(w.toLowerCase()) || /^d['’]/i.test(w) || w.startsWith("(")) { stop = true; return w; }
    return /[sxz]$/i.test(w) ? w : w + "s";
  }).join(" ");
}

/* Quantité pour la fiche recette (arrondi lisible) */
function fmtRecipeQty(q, unit) {
  if (unit === "g" || unit === "ml") {
    const step = q >= 50 ? 5 : 1;
    const v = Math.max(step, Math.round(q / step) * step);
    if (v >= 1000) return FRC.format(v / 1000) + (unit === "g" ? " kg" : " L");
    return v + " " + unit;
  }
  const f = fraction(q);
  const n = Math.round(q * 4) / 4;
  if (unit === "pièce") return f;
  const lab = UNIT_LABEL[unit] || unit;
  const labP = (unit === "gousse" || unit === "tranche") && n > 1 ? lab + "s" : lab;
  return f + " " + labP;
}
function recipeIngredientLine(ing, P) {
  const q = ing.baseQty * P;
  const n = Math.round(q * 4) / 4;
  return { qty: fmtRecipeQty(q, ing.unit), name: ing.unit === "pièce" ? plural(ing.item, n) : ing.item };
}

/* ---------- liste de courses ---------- */
const AISLES = ["Fruits & Légumes", "Boucherie / Poissonnerie", "Épicerie", "Produits frais"];
function aisleOf(name) {
  const n = name.toLowerCase();
  if (/pâte brisée|pâte à pizza|tofu|houmous/.test(n)) return "Produits frais";
  if (/boîte|coco|sauce|tamari|concassé|bouillon|huile|vinaigre|moutarde|ketchup|\briz\b|pâtes|spaghetti|tagliatelle|coquillette|nouille|semoule|boulgour|quinoa|farine|chapelure|flocons|lentille|pois chiche|olive|tahini|amande|sésame|\bpain\b|tortilla|pita|paprika|cumin|curry|curcuma|origan|thym|piment|coriandre moulue|miel|gnocchi|ras el hanout|garam|cacahuète|fécule/.test(n)) return "Épicerie";
  if (/poulet|dinde|bœuf|boeuf|saumon|cabillaud|colin|crevette|lardon|jambon|saucisse|viande|poisson|agneau|steak|pilon|merguez|dorade|truite/.test(n)) return "Boucherie / Poissonnerie";
  if (/œuf|oeuf|\blait\b|fromage|crème|yaourt|beurre|feta|mozzarella|parmesan|ricotta|cheddar|emmental|gruyère|skyr/.test(n)) return "Produits frais";
  return "Fruits & Légumes";
}
function fmtShopQty(q, unit) {
  if (unit === "g" || unit === "ml") {
    const step = q >= 100 ? 10 : 5;
    const v = Math.max(step, Math.ceil(q / step) * step);
    if (v >= 1000) return FRC.format(v / 1000) + (unit === "g" ? " kg" : " L");
    return v + " " + unit;
  }
  const n = Math.ceil(q - 1e-9);
  if (unit === "pièce") return String(n);
  const lab = UNIT_LABEL[unit] || unit;
  return n + " " + ((unit === "gousse" || unit === "tranche") && n > 1 ? lab + "s" : lab);
}
function buildShopping(plan, P) {
  const acc = new Map();
  plan.slots.forEach(sl => {
    if (!sl.rid) return;
    recipeById(sl.rid).ingredients.forEach(ing => {
      const key = ing.item + "|" + ing.unit;
      const cur = acc.get(key) || { item: ing.item, unit: ing.unit, qty: 0 };
      cur.qty += ing.baseQty * P;
      acc.set(key, cur);
    });
  });
  const groups = AISLES.map(a => ({ aisle: a, items: [] }));
  acc.forEach((v, key) => {
    const count = v.unit === "pièce" ? Math.ceil(v.qty - 1e-9) : v.qty;
    const g = groups.find(x => x.aisle === aisleOf(v.item));
    g.items.push({ key, name: v.unit === "pièce" ? plural(v.item, count) : v.item, qty: fmtShopQty(v.qty, v.unit) });
  });
  groups.forEach(g => g.items.sort((a, b) => a.name.localeCompare(b.name, "fr")));
  return groups.filter(g => g.items.length);
}
function shoppingText(groups, checked, header) {
  const lines = [header, ""];
  groups.forEach(g => {
    lines.push(g.aisle);
    g.items.forEach(it => lines.push("[" + (checked.has(it.key) ? "x" : " ") + "] " + it.qty + " " + it.name));
    lines.push("");
  });
  return lines.join("\n").trim();
}

  return `<label class="opt-card"><input type="${type}" class="vh" ${attr}="${id}" ${checked ? "checked" : ""}><span class="body">${icon ? `<span class="ico" aria-hidden="true">${icon}</span>` : ""}<span class="flex-1"><span class="opt-title">${title}</span><span class="opt-desc">${desc}</span></span><span class="tick" aria-hidden="true">${TICK}</span></span></label>`;
}

/* ----- étape 1 : jours ----- */
function stepDays() {
  const meals = [["lunch", "Déjeuner"], ["dinner", "Dîner"], ["both", "Les deux"]];
  return `
    <div class="flex flex-wrap gap-2 mb-5" role="group" aria-label="Sélection rapide des jours">
      <button type="button" class="btn btn-soft btn-sm" data-quick="all">Tous les jours</button>
      <button type="button" class="btn btn-soft btn-sm" data-quick="week">Semaine (Lun-Ven)</button>
      <button type="button" class="btn btn-soft btn-sm" data-quick="weekend">Week-end</button>
      <button type="button" class="btn btn-line btn-sm" data-quick="none">Tout décocher</button>
    </div>
    <ul class="grid gap-2 list-none p-0 m-0">
      ${DAYS.map((d, k) => `
        <li class="dayrow" data-row="${k}">
          <label class="chk"><input type="checkbox" class="vh" data-day="${k}"><span class="tick" aria-hidden="true">${TICK}</span>${d}</label>
          <div class="seg" role="radiogroup" aria-label="Repas du ${d.toLowerCase()}">
            ${meals.map(([v, l]) => `<label><input type="radio" class="vh" name="meal-${k}" value="${v}" data-meal="${k}"><span>${l}</span></label>`).join("")}
          </div>
        </li>`).join("")}

      <button type="button" class="btn btn-line btn-sm" data-bulk="lunch">Déjeuner</button>
      <button type="button" class="btn btn-line btn-sm" data-bulk="dinner">Dîner</button>
      <button type="button" class="btn btn-line btn-sm" data-bulk="both">Les deux</button>
    </div>
    <p id="days-summary" class="font-semibold mt-5" aria-live="polite"></p>`;
}
function syncDays() {
  const days = state.cfg.days;
  DAYS.forEach((_, k) => {
    const row = $(`[data-row="${k}"]`);
    const on = !!days[k];
    row.classList.toggle("is-on", on);
    $(`[data-day="${k}"]`).checked = on;
    $$(`[data-meal="${k}"]`).forEach(r => { r.checked = on && r.value === days[k]; });
  });
  const nDays = Object.keys(days).filter(k => days[k]).length;
  const nMeals = slotList(days).length;
  $("#days-summary").textContent = nDays
    ? `${nDays} ${plur(nDays, "jour", "jours")}, ${nMeals} ${plur(nMeals, "repas", "repas")} à planifier`
    : "Aucun jour sélectionné : cochez au moins un jour pour continuer.";
  updateNav();
}

/* ----- étape 2 : personnes ----- */
function stepPeople() {
  return `
    <div class="flex flex-col items-center gap-6 py-2">
      <div class="flex items-center gap-5">
        <button type="button" class="round" data-people="-1" aria-label="Retirer une personne"><span aria-hidden="true">−</span></button>
        <div class="text-center">
          <label for="people-input" class="sr-only">Nombre de personnes (1 à 8)</label>
          <input id="people-input" class="num-input" type="number" min="1" max="8" step="1" inputmode="numeric" value="${state.cfg.people}">
          <p class="muted" id="people-label"></p>
        </div>
        <button type="button" class="round" data-people="1" aria-label="Ajouter une personne"><span aria-hidden="true">+</span></button>
      </div>
      <p id="people-hint" class="text-center max-w-md" aria-live="polite"></p>
    </div>`;
}
function syncPeople() {
  const P = state.cfg.people, N = slotList(state.cfg.days).length;
  $("#people-label").textContent = plur(P, "personne", "personnes");
  $('[data-people="-1"]').disabled = P <= 1;
  $('[data-people="1"]').disabled = P >= 8;
  $("#people-hint").innerHTML = `Exemple : 150 g de poulet par personne deviennent <strong>${FR.format(150 * P)} g</strong> pour ${P} ${plur(P, "personne", "personnes")}. Sur ${N} ${plur(N, "repas", "repas")}, cela fait ${N * P} ${plur(N * P, "portion", "portions")}.`;
}
function setPeople(v) {
  state.cfg.people = Math.min(8, Math.max(1, v));
  const inp = $("#people-input");
  if (inp && document.activeElement !== inp) inp.value = state.cfg.people;
  syncPeople();
}

/* ----- étape 3 : budget ----- */
function stepBudget() {
  const b = state.cfg.budget;
  return `
    <div class="grid gap-6">
      <div>
        <label for="budget-num" class="block text-sm muted mb-1">Budget hebdomadaire total, en euros</label>
        <div class="flex items-center gap-2">
          <input id="budget-num" class="field w-28 text-2xl" type="number" min="20" max="250" step="1" inputmode="numeric" value="${b}">
          <span class="font-semibold text-xl" aria-hidden="true">€</span>
        </div>
      </div>
      <div>
        <label for="budget-range" class="sr-only">Curseur du budget, de 20 à 250 euros</label>
        <input id="budget-range" type="range" min="20" max="250" step="5" value="${b}">
        <div class="flex justify-between text-sm muted" aria-hidden="true"><span>20 €</span><span>250 €</span></div>
      </div>
      <div class="rounded-2xl p-4 sm:p-5" style="background:var(--bg)">
        <p class="muted text-sm" id="b-meals"></p>
        <div class="flex items-baseline gap-x-3 gap-y-1 flex-wrap my-1" aria-live="polite">
          <span class="display text-4xl font-extrabold" id="b-per"></span>
          <span class="muted">par personne et par repas</span>
          <span class="badge accent" id="b-level"></span>
        </div>
        <div class="gauge my-6" aria-hidden="true"><i class="g1"></i><i class="g2"></i><i class="g3"></i><span class="marker" id="b-marker"></span></div>
        <div class="flex justify-between text-xs muted" aria-hidden="true"><span>0 €</span><span>3 €</span><span>6 €</span><span>10 € et plus</span></div>
        <p id="b-text" class="mt-3"></p>
        <p id="b-warn" class="alert warn mt-3" role="status" hidden></p>
      </div>
    </div>`;
}
function syncBudget(skipInputs) {
  const { budget, people, days } = state.cfg;
  const meals = slotList(days).length;
  const per = budget / (Math.max(1, meals) * people);
  const lvl = budgetLevel(per);
  if (!skipInputs) { $("#budget-num").value = budget; $("#budget-range").value = budget; }
  else if (document.activeElement !== $("#budget-num")) $("#budget-num").value = budget;
  $("#b-meals").textContent = `${meals} ${plur(meals, "repas", "repas")} pour ${people} ${plur(people, "personne", "personnes")}`;
  $("#b-per").textContent = eur(Math.round(per * 100) / 100);
  $("#b-level").textContent = lvl.label;
  $("#b-text").textContent = lvl.text;
  $("#b-marker").style.left = Math.min(100, (per / 10) * 100) + "%";
  const w = $("#b-warn");
  if (per < MIN_COST) {
    w.hidden = false;
    w.textContent = `Sous ${eur(MIN_COST)} par repas et par personne, aucune recette n'est assez économique. Augmentez le budget ou réduisez le nombre de repas.`;
  } else w.hidden = true;
}
function setBudget(v, skipInputs) {
  state.cfg.budget = Math.min(250, Math.max(20, Math.round(v)));
  if (skipInputs && document.activeElement !== $("#budget-range")) $("#budget-range").value = state.cfg.budget;
  syncBudget(skipInputs);
}

/* ----- étapes 4 à 6 : choix multiples + compteur de recettes ----- */
function poolInfo() {
  const cfg = state.cfg, N = slotList(cfg.days).length, pool = poolFor(cfg), n = pool.length;
  if (n === 0) {
    const h = relaxHints(cfg);
    return { cls: "err", html: `<strong>Aucune recette ne correspond à ces filtres.</strong> ${h.length ? "Essayez de " + h.map(x => `${x.label} (${x.count} recettes)`).join(", ou de ") + "." : "Retirez un filtre pour élargir le choix."}` };
  }
  if (n < N) {
    const h = relaxHints(cfg);
    return { cls: "warn", html: `<strong>${n} ${plur(n, "recette compatible", "recettes compatibles")} pour ${N} repas.</strong> Une recette n'est jamais proposée deux fois : ${N - n} ${plur(N - n, "repas resterait vide", "repas resteraient vides")}.${h.length ? " Pour élargir : " + h.map(x => `${x.label} (${x.count} recettes)`).join(", ") + "." : ""}` };
  }
  if (cfg.styles.length) {
    const s = pool.filter(r => prefersStyle(r, cfg)).length;
    if (s < N) return { cls: "warn", html: `<strong>${n} recettes compatibles, dont ${s} dans les styles choisis.</strong> Des recettes d'autres styles compléteront le planning pour ${N} repas.` };
    return { cls: "info", html: `<strong>${n} recettes compatibles</strong>, dont ${s} dans les styles choisis.` };
  }
  return { cls: "info", html: `<strong>${n} recettes compatibles</strong> avec vos filtres et votre matériel.` };
}
function syncPool() {
  const el = $("#pool");
  if (!el) return;
  const p = poolInfo();
  el.className = "alert " + p.cls + " mt-6";
  el.innerHTML = p.html;
  updateNav();
}
const poolBox = '<div id="pool" class="alert info mt-6" role="status" aria-live="polite"></div>';

function stepStyles() {
  return `<div class="grid gap-3 sm:grid-cols-2">${STYLES.map(s => optCard("checkbox", "data-style", s.id, s.label, s.desc, state.cfg.styles.includes(s.id))).join("")}</div>${poolBox}`;
}
function stepDiets() {
  const none = optCard("checkbox", "data-diet", "none", "Aucun", "Pas de restriction particulière", state.cfg.diets.length === 0);
  return `<div class="grid gap-3 sm:grid-cols-2">${none}${DIETS.map(d => optCard("checkbox", "data-diet", d.id, d.label, d.desc, state.cfg.diets.includes(d.id))).join("")}</div>${poolBox}`;
}
function stepEquip() {
  return `<div class="grid gap-3 sm:grid-cols-2">${EQUIP.map(e => optCard("checkbox", "data-equip", e.id, e.label, e.desc, state.cfg.equip.includes(e.id), EQUIP_ICON[e.id])).join("")}</div>${poolBox}`;
}

/* ----- navigation ----- */
function updateNav() {
  const next = $("#next");
  if (!next) return;
  let ok = true;
  if (!slotList(state.cfg.days).length) ok = false;
  if (state.step === 5 && poolFor(state.cfg).length === 0) ok = false;
  next.disabled = !ok;
}
function goStep(k, focus = true) {
  if (k > 0 && !slotList(state.cfg.days).length) { toast("Cochez au moins un jour pour continuer"); k = 0; }
  state.step = Math.max(0, Math.min(5, k));
  renderWizard(focus);
  if (focus) window.scrollTo({ top: 0, behavior: "smooth" });
}
function generate() {
  if (poolFor(state.cfg).length === 0) { toast("Aucune recette ne correspond à vos filtres"); return; }
  state.plan = buildPlan(state.cfg);
  state.view = "plan";
  renderPlan();
  $("#plan-title").focus();
  window.scrollTo({ top: 0 });
}

/* ============================================================
   PLANNING
   ============================================================ */
function badgesFor(r, cfg) {
  const prio = [...new Set([...cfg.diets, "vegan", "vegetarien"])];
  return prio.filter(t => r.diet.includes(t)).slice(0, 3).map(t => `<span class="badge accent">${DIET_LABEL[t]}</span>`).join("");
}

function slotHTML(sl, idx) {
  const { cfg } = state, P = cfg.people;
  const r = sl.rid ? recipeById(sl.rid) : null;
  const label = `${DAYS[sl.day]}, ${MEAL_LABEL[sl.meal].toLowerCase()}`;
  if (!r) {
    return `<li class="slot"><p class="slot-empty"><strong class="block" style="color:var(--ink)">${MEAL_LABEL[sl.meal]}</strong>Aucune recette disponible pour ce repas : toutes les recettes compatibles sont déjà utilisées ou dépasseraient le budget.</p>
      <div class="slot-foot"><span></span><button type="button" class="link-btn" data-replace="${idx}" aria-label="Chercher une recette pour ${esc(label)}">Chercher une recette</button></div></li>`;
  }
  return `<li class="slot">
    <button type="button" class="slot-open" data-open="${idx}" aria-haspopup="dialog" aria-label="Voir la recette ${esc(r.name)}, ${esc(label)}">
      <span class="slot-icon" aria-hidden="true">${iconFor(r)}</span>
      <span class="flex-1 min-w-0">
        <span class="muted text-sm block">${MEAL_LABEL[sl.meal]}</span>
        <span class="slot-name block">${esc(r.name)}</span>
        <span class="meta"><span><b>${totalTime(r)} min</b> au total</span><span><b>${r.calories} kcal</b> par personne</span><span><b>${eur(r.costPerPerson * P)}</b> le repas</span></span>
        <span class="flex flex-wrap gap-1 mt-2">${badgesFor(r, cfg)}</span>
      </span>
    </button>
    <div class="slot-foot">
      <span class="muted text-xs">${esc(STYLE_LABEL[r.category])}</span>
      <button type="button" class="link-btn" data-replace="${idx}" aria-label="Remplacer cette recette : ${esc(r.name)}, ${esc(label)}">Remplacer cette recette</button>
    </div></li>`;
}

function renderPlan(focusSel) {
  const { cfg, plan } = state, P = cfg.people, B = cfg.budget;
  const filled = plan.slots.filter(s => s.rid);
  const missing = plan.slots.length - filled.length;
  const cost = planCost(plan, P);
  const over = cost > B + 0.005;
  const nMeals = filled.length;
  const perMeal = nMeals ? cost / (nMeals * P) : 0;
  const lvl = budgetLevel(perMeal);
  const avgK = nMeals ? Math.round(filled.reduce((s, x) => s + recipeById(x.rid).calories, 0) / nMeals) : 0;
  const avgP = nMeals ? Math.round(filled.reduce((s, x) => s + recipeById(x.rid).protein, 0) / nMeals) : 0;
  const fallback = cfg.styles.length ? filled.filter(s => !prefersStyle(recipeById(s.rid), cfg)).length : 0;
  const poolSize = poolFor(cfg).length;

  const alerts = [];
  if (over) {
    const need = poolFor(cfg).map(r => r.costPerPerson).sort((a, b) => a - b).slice(0, plan.slots.length).reduce((s, c) => s + c, 0) * P;
    alerts.push(`<div class="alert err" role="alert"><strong>Budget dépassé de ${eur(cost - B)}.</strong> Avec ces filtres, ${plan.slots.length} ${plur(plan.slots.length, "repas coûte", "repas coûtent")} au minimum ${eur(need)} pour ${P} ${plur(P, "personne", "personnes")}. Augmentez le budget ou réduisez le nombre de repas.</div>`);
  }
  if (missing) {
    const h = relaxHints(cfg);
    alerts.push(`<div class="alert warn" role="status"><strong>${missing} ${plur(missing, "repas sans recette", "repas sans recette")}.</strong> Seules ${poolSize} ${plur(poolSize, "recette respecte", "recettes respectent")} vos filtres, et aucune n'est proposée deux fois.${h.length ? " Pour élargir : " + h.map(x => `${x.label} (${x.count} recettes)`).join(", ") + "." : ""}</div>`);
  }
  if (fallback) {
    alerts.push(`<div class="alert warn" role="status"><strong>${fallback} ${plur(fallback, "recette sort", "recettes sortent")} des styles choisis.</strong> Il n'y avait pas assez de recettes dans ces styles pour remplir tout le planning.</div>`);
  }
  if (cfg.diets.includes("halal")) {
    alerts.push(`<div class="alert info"><strong>Halal :</strong> les recettes sont sans porc ni alcool. Choisissez de la viande certifiée halal en magasin.</div>`);
  }

  const dayIdx = [...new Set(plan.slots.map(s => s.day))];
  const cards = dayIdx.map(d => `
    <article class="day-card" aria-labelledby="day-${d}">
      <h2 id="day-${d}" class="day-name">${DAYS[d]}</h2>
      <ul class="list-none p-0 m-0 grid gap-3">
        ${plan.slots.map((sl, idx) => sl.day === d ? slotHTML(sl, idx) : "").join("")}
      </ul>
    </article>`).join("");

  $("#view").innerHTML = `
    <div class="fade-in">
      <div class="flex flex-wrap items-end justify-between gap-4 mb-6">
        <div>
          <h1 id="plan-title" tabindex="-1" class="text-4xl sm:text-5xl font-extrabold">Votre semaine à table</h1>
          <p class="muted mt-2">${dayIdx.length} ${plur(dayIdx.length, "jour", "jours")}, ${plan.slots.length} ${plur(plan.slots.length, "repas", "repas")}, ${P} ${plur(P, "personne", "personnes")}</p>
        </div>
        <div class="flex flex-wrap gap-2 no-print">
          <button type="button" id="btn-shop" class="btn btn-primary">Voir la liste de courses</button>
          <button type="button" id="btn-regen" class="btn btn-soft">Régénérer le planning</button>
          <button type="button" id="btn-edit" class="btn btn-line">Modifier mes choix</button>
        </div>
      </div>

      <section class="panel p-5 sm:p-6 mb-6" aria-label="Résumé du budget et de la nutrition">
        <div class="grid gap-6 md:grid-cols-[1.4fr_1fr]">
          <div>
            <p class="muted text-sm">Coût estimé</p>
            <p class="flex items-baseline gap-2 flex-wrap"><span class="display text-4xl font-extrabold" style="${over ? "color:var(--err-ink)" : ""}">${eur(cost)}</span><span class="muted">sur un budget de ${eur(B)}</span></p>
            <div class="bar my-3" role="progressbar" aria-label="Coût estimé par rapport au budget" aria-valuemin="0" aria-valuemax="${B}" aria-valuenow="${Math.round(cost)}"><span style="width:${Math.min(100, (cost / B) * 100)}%;${over ? "background:var(--err-ink)" : ""}"></span></div>
            <p class="text-sm">${over ? `Dépassement de ${eur(cost - B)}.` : `Il reste ${eur(B - cost)} de marge.`} Soit ${eur(Math.round(perMeal * 100) / 100)} par personne et par repas <span class="badge accent ml-1">${lvl.label}</span></p>
          </div>
          <dl class="grid grid-cols-2 gap-3 content-start">
            <div class="fact"><b>${avgK} kcal</b><span>par repas et par personne, en moyenne</span></div>
            <div class="fact"><b>${avgP} g</b><span>de protéines par repas, en moyenne</span></div>
          </dl>
        </div>
      </section>

      ${alerts.length ? `<div class="grid gap-3 mb-6">${alerts.join("")}</div>` : ""}

      <div class="grid gap-4 md:grid-cols-2 xl:grid-cols-3">${cards}</div>
    </div>`;
  if (focusSel) { const el = $(focusSel); if (el) el.focus(); }
}

function replaceSlot(idx) {
  const res = pickReplacement(state.plan, idx, state.cfg);
  if (!res.id) {
    toast(res.reason === "budget" ? "Aucune alternative dans votre budget" : "Aucune autre recette compatible avec vos filtres");
    return;
  }
  state.plan.slots[idx].rid = res.id;
  renderPlan(`[data-replace="${idx}"]`);
  toast("Remplacé par « " + recipeById(res.id).name + " »");
}

      <div class="fact"><b>${r.calories} kcal</b><span>par personne</span></div>
      <div class="fact"><b>${r.protein} g</b><span>de protéines par personne</span></div>
      <div class="fact"><b>${eur(r.costPerPerson * P)}</b><span>${eur(r.costPerPerson)} par personne</span></div>

    <h3 class="text-xl font-bold mb-3">Ingrédients pour ${P} ${plur(P, "personne", "personnes")}</h3>
    <dl class="ing mb-7">${ing}</dl>
    <p class="muted text-sm mb-7">Sel, poivre et eau ne sont pas comptés dans les quantités.</p>
    <h3 class="text-xl font-bold mb-4">Préparation</h3>
    <ol class="steps-list">${r.instructions.map(s => `<li><p>${esc(s)}</p></li>`).join("")}</ol>
    <p class="muted text-sm mt-7">Matériel : ${esc(equip)}</p>
    <div class="flex justify-end mt-6"><button type="button" class="btn btn-primary" data-close>Fermer</button></div>`, opener);
}

function shoppingHeader() {
  const meals = state.plan.slots.filter(s => s.rid).length, P = state.cfg.people;
  return `Liste de courses Semainier : ${P} ${plur(P, "personne", "personnes")}, ${meals} ${plur(meals, "repas", "repas")}`;
}
function updateChecked() {
  const keys = $$("[data-item]", $("#modal-root"));
  const n = keys.filter(k => k.checked).length;
  const el = $("#shop-count");
  if (el) el.textContent = `${n} sur ${keys.length} ${plur(keys.length, "article coché", "articles cochés")}`;
}
function openShopping(opener) {
  const groups = buildShopping(state.plan, state.cfg.people);
  state.shop = groups;
  const total = groups.reduce((s, g) => s + g.items.length, 0);
  const meals = state.plan.slots.filter(s => s.rid).length, P = state.cfg.people;
  openModal(`
    <div class="flex items-start gap-3 mb-5">
      <div class="flex-1 min-w-0">
        <h2 id="dlg-title" class="text-3xl font-extrabold">Liste de courses</h2>
        <p class="muted mt-1">${total} ${plur(total, "article", "articles")} pour ${meals} ${plur(meals, "repas", "repas")} et ${P} ${plur(P, "personne", "personnes")}</p>
        <p id="shop-count" class="text-sm font-semibold mt-1" aria-live="polite"></p>
      </div>
      <button type="button" class="x-btn" data-close aria-label="Fermer la liste de courses">${CLOSE}</button>
    </div>
    ${groups.map(g => `
      <section class="mb-6" aria-label="${esc(g.aisle)}">
        <h3 class="aisle-title"><span>${esc(g.aisle)}</span><span class="muted text-sm font-medium">${g.items.length} ${plur(g.items.length, "article", "articles")}</span></h3>
        <ul class="list-none p-0 m-0">
          ${g.items.map(it => `<li><label class="check"><input type="checkbox" class="vh" data-item="${esc(it.key)}" ${state.checked.has(it.key) ? "checked" : ""}><span class="tick" aria-hidden="true">${TICK}</span><span class="qty">${esc(it.qty)}</span><span class="txt">${esc(it.name)}</span></label></li>`).join("")}
        </ul>
      </section>`).join("")}
    <div id="copy-fallback" hidden class="mb-4">
      <label for="copy-area" class="block text-sm muted mb-1">Copie automatique impossible : sélectionnez et copiez ce texte.</label>
      <textarea id="copy-area" class="field w-full" rows="8" readonly></textarea>
    </div>
    <div class="flex flex-wrap justify-end gap-2">
      <button type="button" class="btn btn-line" data-close>Fermer</button>
      <button type="button" class="btn btn-primary" id="copy-btn">Copier la liste</button>
    </div>`, opener);
  updateChecked();
}

async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; }
  } catch (e) { /* repli ci-dessous */ }
  try {
    const ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand("copy");
    ta.remove();
    return ok;
  } catch (e) { return false; }
}
async function copyShopping() {
  const text = shoppingText(state.shop, state.checked, shoppingHeader());
  if (await copyText(text)) { toast("Liste copiée dans le presse-papiers"); return; }
  const box = $("#copy-fallback"), area = $("#copy-area");
  box.hidden = false; area.value = text; area.focus(); area.select();
}

/* ============================================================
   ÉVÉNEMENTS
   ============================================================ */
const view = $("#view"), modalRoot = $("#modal-root");

view.addEventListener("click", e => {
  const t = e.target.closest("button");
  if (!t) return;
  if (t.dataset.goto !== undefined) return goStep(+t.dataset.goto);
  if (t.id === "back") return goStep(state.step - 1);
  if (t.id === "next") return state.step < 5 ? goStep(state.step + 1) : generate();
  if (t.dataset.quick) {
    const sel = { all: [0, 1, 2, 3, 4, 5, 6], week: [0, 1, 2, 3, 4], weekend: [5, 6], none: [] }[t.dataset.quick];
    const old = state.cfg.days, days = {};
    sel.forEach(k => { days[k] = old[k] || "dinner"; });
    state.cfg.days = days;
    return syncDays();
  }
  if (t.dataset.bulk) {
    Object.keys(state.cfg.days).forEach(k => { state.cfg.days[k] = t.dataset.bulk; });
    return syncDays();
  }
  if (t.dataset.people) return setPeople(state.cfg.people + +t.dataset.people);
  if (t.dataset.open !== undefined) return openRecipe(+t.dataset.open, t);
  if (t.dataset.replace !== undefined) return replaceSlot(+t.dataset.replace);
  if (t.id === "btn-shop") return openShopping(t);
  if (t.id === "btn-regen") { state.plan = buildPlan(state.cfg); renderPlan("#plan-title"); toast("Nouveau planning généré"); return; }
  if (t.id === "btn-edit") { state.view = "wizard"; state.step = 0; renderWizard(true); window.scrollTo({ top: 0 }); }
});

view.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.day !== undefined) {
    const k = +t.dataset.day;
    if (t.checked) state.cfg.days[k] = state.cfg.days[k] || "dinner"; else delete state.cfg.days[k];
    return syncDays();
  }
  if (t.dataset.meal !== undefined) { state.cfg.days[+t.dataset.meal] = t.value; return syncDays(); }
  if (t.dataset.style) {
    const s = new Set(state.cfg.styles);
    t.checked ? s.add(t.dataset.style) : s.delete(t.dataset.style);
    state.cfg.styles = STYLES.map(x => x.id).filter(id => s.has(id));
    return syncPool();
  }
  if (t.dataset.diet) {
    if (t.dataset.diet === "none") state.cfg.diets = [];
    else {
      const s = new Set(state.cfg.diets);
      t.checked ? s.add(t.dataset.diet) : s.delete(t.dataset.diet);
      state.cfg.diets = DIETS.map(x => x.id).filter(id => s.has(id));
    }
    $$("[data-diet]").forEach(i => { i.checked = i.dataset.diet === "none" ? state.cfg.diets.length === 0 : state.cfg.diets.includes(i.dataset.diet); });
    return syncPool();
  }
  if (t.dataset.equip) {
    const s = new Set(state.cfg.equip);
    t.checked ? s.add(t.dataset.equip) : s.delete(t.dataset.equip);
    state.cfg.equip = EQUIP.map(x => x.id).filter(id => s.has(id));
    return syncPool();
  }
  if (t.id === "people-input") { setPeople(parseInt(t.value, 10) || state.cfg.people); t.value = state.cfg.people; }
  if (t.id === "budget-num") { setBudget(parseFloat(t.value) || state.cfg.budget); }
});

view.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "people-input") { const v = parseInt(t.value, 10); if (v >= 1 && v <= 8) setPeople(v); }
  if (t.id === "budget-range") setBudget(+t.value, true);
  if (t.id === "budget-num") { const v = parseFloat(t.value); if (v >= 20 && v <= 250) setBudget(v, true); }
});

modalRoot.addEventListener("click", e => {
  if (e.target.closest("[data-close]") || e.target.matches("[data-overlay]")) return closeModal();
  if (e.target.closest("#copy-btn")) copyShopping();
});
modalRoot.addEventListener("change", e => {
  const k = e.target.dataset && e.target.dataset.item;
  if (k === undefined) return;
  e.target.checked ? state.checked.add(k) : state.checked.delete(k);
  updateChecked();
});

document.addEventListener("keydown", e => {
  const dlg = $("#modal-root .dialog");
  if (!dlg) return;
  if (e.key === "Escape") { e.preventDefault(); return closeModal(); }
  if (e.key !== "Tab") return;
  const f = $$('button, [href], input:not([type="hidden"]), textarea, [tabindex]:not([tabindex="-1"])', dlg).filter(x => !x.disabled && !x.closest("[hidden]"));
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && (document.activeElement === first || document.activeElement === dlg)) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});

renderWizard(false);
</script>
</body>
